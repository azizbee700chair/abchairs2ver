function uiOverlaySetP(p) {
  uiOverlay.p = p;
  const txt = Math.round(p) + '%';
  document.getElementById('uo-pa').textContent = txt;
  document.getElementById('uo-pb').textContent = txt;
  document.getElementById('uo-bar').style.width = p + '%';
  document.getElementById('uo-level').setAttribute('transform', 'translate(0,' + (62 - p * 0.6).toFixed(2) + ')');
}
function uiOverlayTick() {
  if (uiOverlay.finishing) return;
  uiOverlaySetP(Math.max(uiOverlay.p, 90 * (1 - Math.exp(-(performance.now() - uiOverlay.t0) / 900))));
  uiOverlay.raf = setTimeout(uiOverlayTick, 30);
}
function uiOverlayStart(text, kind) {
  uiOverlay.n++;
  if (kind === 'kirish') uiOverlay.kirish++;
  const el = uiOverlayEl();
  document.getElementById('ui-overlay-text').textContent = text;
  document.getElementById('ui-overlay-text2').textContent = text;
  el.classList.toggle('b', uiOverlay.kirish > 0);
  el.classList.toggle('a', uiOverlay.kirish === 0);
  clearTimeout(uiOverlay.endTimer);
  if (uiOverlay.finishing || el.style.display === 'none') {
    const fresh = el.style.display === 'none';
    uiOverlay.finishing = false;
    el.classList.remove('fade');
    if (fresh) {
      uiOverlay.t0 = performance.now();
      uiOverlaySetP(0);
      el.style.display = 'flex';
      void el.offsetWidth;   // ko'rinishga silliq kirishi uchun
    }
    el.classList.add('on');
    clearTimeout(uiOverlay.raf);
    uiOverlay.raf = setTimeout(uiOverlayTick, 30);
  }
}
function uiOverlayEnd(kind) {
  uiOverlay.n = Math.max(0, uiOverlay.n - 1);
  if (kind === 'kirish') uiOverlay.kirish = Math.max(0, uiOverlay.kirish - 1);
  if (uiOverlay.n > 0) return;
  clearTimeout(uiOverlay.endTimer);
  uiOverlay.endTimer = setTimeout(() => {
    if (uiOverlay.n > 0) return;
    const el = uiOverlayEl();
    uiOverlay.finishing = true;
    clearTimeout(uiOverlay.raf);
    const from = uiOverlay.p, s0 = performance.now();
    (function fin() {
      if (!uiOverlay.finishing) return;   // shu orada yangi amal boshlandi
      const k = Math.min(1, (performance.now() - s0) / 250);
      uiOverlaySetP(from + (100 - from) * k);
      if (k < 1) { uiOverlay.raf = setTimeout(fin, 30); return; }
      el.classList.add('fade');
      uiOverlay.endTimer = setTimeout(() => {
        if (!uiOverlay.finishing) return;
        uiOverlay.finishing = false;
        el.classList.remove('on', 'fade');
        el.style.display = 'none';
      }, 220);
    })();
  }, 150);
}

// options.overlay: ko'rsatiladigan matn yoki false. Berilmasa: GET — ko'rsatilmaydi
// (fon yangilanishi bezovta qilmasin), boshqa metodlar — «Saqlanmoqda...».
// ---- sessiya tokenini saqlash ----
// Asosiy joy — localStorage. Zaxira — cookie: ba'zi telefon ilovalaridagi (WebView) brauzerda
// localStorage ilova yopilganda saqlanib qolmaydi, cookie esa qoladi.
const TOKEN_COOKIE = 'stul_token';
function readCookie(name) {
  try {
    const m = document.cookie.split('; ').find(x => x.indexOf(name + '=') === 0);
    return m ? decodeURIComponent(m.slice(name.length + 1)) : '';
  } catch (e) { return ''; }
}
function saveToken(token) {
  apiToken = token || '';
  storage.set('stul_api_token', apiToken);
  try { document.cookie = `${TOKEN_COOKIE}=${encodeURIComponent(apiToken)}; max-age=${60 * 60 * 24 * 60}; path=/; SameSite=Lax`; } catch (e) {}
}
function clearToken() {
  apiToken = '';
  storage.remove('stul_api_token');
  try { document.cookie = `${TOKEN_COOKIE}=; max-age=0; path=/; SameSite=Lax`; } catch (e) {}
}
function readToken() {
  return (storage.get('stul_api_token') || {}).value || readCookie(TOKEN_COOKIE) || '';
}

// ---- serversiz rejim (GitHub Pages + Supabase) ----
// SUPABASE_URL to'ldirilgan bo'lsa, so'rovlar alohida serverga emas, to'g'ridan-to'g'ri Supabase'dagi
// yagona stul_api funksiyasiga yuboriladi (hamma qoida va tekshiruv bazaning o'zida bajariladi).
// Bo'sh bo'lsa — sahifa avvalgidek o'zi turgan server (FastAPI) bilan ishlaydi.
// Bu yerdagi kalit — Supabase'ning OCHIQ (publishable/anon) kaliti; u bilan faqat stul_api ni chaqirish mumkin.
const SUPABASE_URL = 'https://yyxfrvpqztqfexssshog.supabase.co';
const SUPABASE_KEY = 'sb_publishable_x6rniFk5mcVZSRAicCUaxg_CkiILzuN';

async function apiCallSupabase(path, method, body) {
  const u = new URL(path, 'http://x');
  const query = {};
  u.searchParams.forEach((v, k) => { query[k] = v; });
  let payload = {};
  if (body !== undefined && body !== null) payload = typeof body === 'string' ? JSON.parse(body) : body;
  const response = await fetch(SUPABASE_URL.replace(/\/+$/, '') + '/rest/v1/rpc/stul_api', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` },
    body: JSON.stringify({ p_method: method, p_path: decodeURIComponent(u.pathname), p_query: query, p_body: payload, p_token: apiToken || '' })
  });
  let data = null;
  try { data = await response.json(); } catch (_) { data = null; }
  if (!response.ok) {
    // Bazadagi qoidalar xatoni «PT409» kabi kod bilan qaytaradi (409 — HTTP holati)
    const code = data && typeof data.code === 'string' && /^PT\d{3}$/.test(data.code) ? Number(data.code.slice(2)) : response.status;
    const err = new Error((data && (data.message || data.detail)) || `HTTP ${response.status}`);
    err.status = code;
    throw err;
  }
  if (data && typeof data === 'object' && data.__status) {
    const err = new Error(data.detail || `HTTP ${data.__status}`);
    err.status = data.__status;
    throw err;
  }
  return data;
}

async function apiCall(path, options = {}) {
  const { overlay, ...fetchOptions } = options;
  const method = String(fetchOptions.method || 'GET').toUpperCase();
  const overlayText = overlay !== undefined ? overlay : (method === 'GET' ? '' : 'Saqlanmoqda...');
  if (SUPABASE_URL) {
    if (overlayText) uiOverlayStart(overlayText);
    try { return await apiCallSupabase(path, method, fetchOptions.body); }
    finally { if (overlayText) uiOverlayEnd(); }
  }
  const headers = Object.assign({}, fetchOptions.headers || {});
  if (apiToken) headers['Authorization'] = `Bearer ${apiToken}`;
  let body = fetchOptions.body;
  if (body !== undefined && body !== null && typeof body !== 'string') {
    headers['Content-Type'] = 'application/json';
    body = JSON.stringify(body);
  }
  if (overlayText) uiOverlayStart(overlayText);
  try {
    const response = await fetch(path, { ...fetchOptions, headers, body });
    let data = null;
    try { data = await response.json(); } catch (_) { data = null; }
    if (!response.ok) {
      const err = new Error((data && data.detail) || `HTTP ${response.status}`);
      err.status = response.status;
      throw err;
    }
    return data;
  } finally {
    if (overlayText) uiOverlayEnd();
  }
}

function apiShowError(err, prefix = 'Amal bajarilmadi') {
  console.error(prefix, err);
  if (err && err.status === 401) {
    clearToken();
    storage.remove('app_user');
    state.user = null;
    state.loginErr = true;
    isOnline = false;
    render();
    alert('Sessiya tugagan yoki token yaroqsiz. Iltimos, qayta kiring.');
    return;
  }
  alert(`${prefix}: ${(err && err.message) || 'Noma’lum xato'}`);
}

function normalizeDispatch(d) {
  const model = d.model || '';
  const color = d.rang_kodi || '';
  return {
    id: String(d.id),
    vaqt: d.sana || d.vaqt || '',
    konver: d.konver || '-',
    model: model,
    rang_kodi: color,
    modelKey: d.model_key || `${model}${color ? '-' + color : ''}`,
    soni: Number(d.stul_soni || d.soni || 0),
    izoh: d.izoh || d.mijoz || '',
    mijoz: d.mijoz || null,
    narxBirlik: Number(d.narx_usd || d.narxBirlik || 0),
    jamiSumma: Number(d.jami_usd || d.jamiSumma || 0),
    stockId: d.ombor_qoldiq_id || null
  };
}

// kind === 'kirish': ilova ochilishi / dasturga kirish — katta stul ko'rinishi
async function syncFromSheets(force = false, kind) {
  const ov = force && kind !== 'intro';   // 'intro': ochilish animatsiyasi ko'rinib turibdi — oyna kerak emas
  if (ov) uiOverlayStart(kind === 'kirish' ? 'Ma’lumotlar yuklanmoqda…' : 'Yangilanmoqda...', kind);
  try { return await syncFromSheetsInner(force); }
  finally { if (ov) uiOverlayEnd(kind); }
}

async function syncFromSheetsInner(force = false) {
  if (!apiToken) {
    isOnline = false;
    state.user = null;
    if (force) render();
    return;
  }
  try {
    const data = await apiCall('/api/bootstrap' + (lastApiEtag ? '?etag=' + encodeURIComponent(lastApiEtag) : ''));
    if (!data || data.ok !== true) throw new Error('Backend kutilgan ma’lumot formatini qaytarmadi');
    if (data.token) saveToken(data.token); // sessiya uzaytirildi
    if (data.unchanged && state.loaded && state.user) {
      // oxirgi yangilanishdan beri hech narsa o'zgarmagan — ma'lumot qayta yuborilmadi
      isOnline = true;
      state.saveFailedBanner = false;
      if (force) render();
      return;
    }
    lastApiEtag = data.etag || '';
    const snapshot = JSON.stringify([data.orders, data.stock_groups, data.dispatches, data.archive_count, data.fasonlar]);
    const changed = snapshot !== lastApiSnapshot;
    state.user = {
      login: (data.user && data.user.login) || state.user?.login || '',
      bolim: (data.user && data.user.department) || state.user?.bolim || '',
      display_name: (data.user && data.user.display_name) || ''
    };
    state.orders = Array.isArray(data.orders) ? data.orders : [];
    // Tarix va arxiv kundalik yangilanishda kelmaydi (katta hajm). Arxiv kerakli oynalar
    // ochilganda ensureArchive() orqali, konver tarixi esa oynasi ochilganda yuklanadi.
    const archiveCount = Number(data.archive_count || 0);
    if (state.archiveLoaded && state.archiveLoadedCount !== archiveCount) state.archiveLoaded = false; // arxiv o'zgargan — qayta yuklanadi
    state.archiveCount = archiveCount;
    state.ombor = { zaxira: {}, chiqimlar: [] };
    for (const g of (Array.isArray(data.stock_groups) ? data.stock_groups : [])) {
      const id = String(g.id);
      state.ombor.zaxira[id] = {
        soni: Number(g.stul_soni || 0),
        narx: Number(g.narx_usd || 0),
        model: g.model || '',
        rang: g.rang_kodi || '',
        rang_kodi: g.rang_kodi || '',
        stockId: id,
        productKey: g.product_key || ''
      };
    }
    state.ombor.chiqimlar = (Array.isArray(data.dispatches) ? data.dispatches : [])
      .map(normalizeDispatch)
      .sort((a, b) => new Date(a.vaqt) - new Date(b.vaqt));
    if (data.fasonlar && Array.isArray(data.fasonlar.MODELS)) {
      MODELS = data.fasonlar.MODELS.slice();
      MODEL_START_STAGE = data.fasonlar.MODEL_START_STAGE || {};
    }
    isOnline = true;
    state.saveFailedBanner = false;
    lastApiSnapshot = snapshot;
    state.loaded = true;
    loadStatDatesForCurrentUser();
    if (force || (changed && !['INPUT','SELECT','TEXTAREA'].includes(document.activeElement?.tagName))) render();
  } catch (err) {
    isOnline = false;
    if (err && err.status === 401) {
      clearToken();
      storage.remove('app_user');
      state.user = null;
      state.loaded = true;
      render();
    } else {
      console.error('FastAPI bilan sinxronlashda xato:', err);
      if (force) { state.loaded = true; render(); apiShowError(err, 'Ma’lumotlarni yangilash amalga oshmadi'); }
    }
  }
}

async function manualRefresh() {
  if (state.manualSyncInProgress) return;
  state.manualSyncInProgress = true;
  render();
  await syncFromSheets(true);
  state.manualSyncInProgress = false;
  render();
}

function startSheetsPolling() {
  if (apiPollingTimer) clearInterval(apiPollingTimer);
  if (!apiToken) return;
  syncFromSheets(false);   // chaqiruvchi ma'lumotni hozirgina yuklagan — qayta oyna ko'rsatilmaydi
  apiPollingTimer = setInterval(() => { if (apiToken) syncFromSheets(false); }, SYNC_INTERVAL_MS);
}

function introStart() {
  if (window.__introShown) return false;
  window.__introShown = true;
  try { if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return false; } catch (e) {}
  const el = document.createElement('div');
  el.id = 'intro';
  el.innerHTML = INTRO_HTML;
  const word = el.querySelector('.word');
  'ABchairs'.split('').forEach((ch, i) => {
    const s = document.createElement('span');
    s.textContent = ch;
    // harf chiqadi, so'ng harflar ketma-ket yorishib o'tadi (yaltiroq nur)
    s.style.animation = 'in-letter .55s cubic-bezier(.2,.9,.3,1.2) ' + (1.55 + i * 0.07) + 's forwards, in-glint .5s ease-in-out ' + (2.6 + i * 0.06) + 's';
    word.insertBefore(s, word.lastElementChild);
  });
  document.body.appendChild(el);
  void el.offsetWidth;
  el.classList.add('go');
  introState = { el, t0: performance.now() };
  return true;
}
function introEnd() {
  if (!introState) return Promise.resolve();
  const st = introState;
  introState = null;
  const wait = Math.max(0, INTRO_MIN_MS - (performance.now() - st.t0));
  return new Promise(res => setTimeout(() => {
    st.el.classList.add('out');
    setTimeout(() => { st.el.remove(); res(); }, 450);
  }, wait));
}
function loadData() {
  const savedLang = storage.get('app_lang');
  if (savedLang) state.lang = savedLang.value;
  // Eski ilovadagi localStorage foydalanuvchisi endi ishonchli autentifikatsiya hisoblanmaydi.
  storage.remove('app_user');
  const savedTab = storage.get('app_tab');
  apiToken = readToken();
  state.user = null;
  state.loaded = true;
  state.ombor = { zaxira: {}, chiqimlar: [] };
  if (savedTab) state.tab = savedTab.value;
  const intro = introStart();
  if (!apiToken) { render(); introEnd(); return; }
  let synced = false;
  const sync = syncFromSheets(true, intro ? 'intro' : 'kirish').finally(() => { synced = true; });
  if (intro) {
    // animatsiya kamida o'z vaqtini o'ynaydi; ma'lumot juda uzoq kelsa (12 s), oddiy yuklanish oynasiga o'tiladi
    Promise.race([sync, new Promise(r => setTimeout(r, 12000))]).then(() => introEnd()).then(() => {
      if (!synced) { uiOverlayStart('Ma’lumotlar yuklanmoqda…', 'kirish'); sync.finally(() => uiOverlayEnd('kirish')); }
    });
  }
  sync.then(() => {
    if (state.user) {
      const def = state.user.bolim === 'admin' ? 'menu' : (state.user.bolim === 'ombor' ? 'ombor_menu' : 'ish');
      if (!storage.get('app_tab')) state.tab = def;
      startSheetsPolling();
    }
    render();
  });
}

async function deleteOrder(konverId) {
  const order = findOrder(konverId);
  if (order && (order.partiyalar || []).some(p => p.bosqich === 'ombor' && p.holat === 'tugadi')) {
    if (!SUPABASE_URL) {
      alert('Bu konverning stullari omborga kirim qilingan. Ombor hisobini buzmaslik uchun avval alohida tekshiruv va tuzatish kerak; hozir bevosita o‘chirilmadi.');
      return;
    }
    // Omborga kirgan konver: avval nima o'chishini ko'rsatib, tasdiq so'raymiz — so'ng konver ombor
    // qoldig'i va chiqimlardan ham ayirilib, «hech qachon bo'lmagandek» o'chiriladi.
    const base = `/api/orders/${encodeURIComponent(konverId)}`;
    try {
      const p = await apiCall(base + '?preview=true', { method: 'DELETE', overlay: 'Tekshirilmoqda...' });
      const lines = [`«${konverId}» (${p.model}) butunlay o‘chiriladi:`, ''];
      if (p.ishlab_chiqarishda > 0) lines.push(`• Ishlab chiqarishdagi ${p.ishlab_chiqarishda} dona — yo‘qoladi`);
      for (const s of p.ombor || []) {
        if (s.ombordan > 0) lines.push(`• Ombor (${s.rang}): ${s.ombordan} dona ayiriladi`);
      }
      for (const d of p.chiqimlar || []) {
        const sana = d.sana ? new Date(d.sana).toLocaleDateString('ru-RU') : '';
        lines.push(d.qoladi > 0
          ? `• Chiqim ${sana} ${d.mijoz || ''} (${d.rang}): ${d.soni} → ${d.qoladi} dona`
          : `• Chiqim ${sana} ${d.mijoz || ''} (${d.rang}, ${d.soni} dona) — o‘chiriladi`);
      }
      if (p.topilmadi > 0) lines.push(`• ${p.topilmadi} dona na omborda, na chiqimlarda topilmadi`);
      lines.push('', 'Bu amalni qaytarib bo‘lmaydi. Davom etilsinmi?');
      if (!confirm(lines.join('\n'))) return;
      await apiCall(base + '?with_stock=true', { method: 'DELETE', overlay: 'O‘chirilmoqda...' });
      await syncFromSheets(true);
    } catch (err) { apiShowError(err, 'Buyurtmani o‘chirish amalga oshmadi'); }
    return;
  }
  if (!confirm(L().ochirishTasdiq)) return;
  try { await apiCall(`/api/orders/${encodeURIComponent(konverId)}`, { method: 'DELETE' }); await syncFromSheets(true); }
  catch (err) { apiShowError(err, 'Buyurtmani o‘chirish amalga oshmadi'); }
}

// Bo'lak bir bosqich orqaga qaytganda qaysi bo'limga tushadi (server bilan bir xil qoida).
// null — qaytarib bo'lmaydi: tugatilgan bo'lak yoki fasonning birinchi bo'limi.
function fixPrevStage(order, part) {
  if (!order || !part || part.holat === 'tugadi') return null;
  const idx = STAGE_SEQ.indexOf(part.bosqich);
  if (idx <= 0 || idx <= STAGE_SEQ.indexOf(getModelStartStage(order.model))) return null;
  if (part.bosqich === 'susal' || (part.bosqich === 'qoplash' && !part.susal)) return 'lak';
  return STAGE_SEQ[idx - 1];
}

function oylikLocalDate(d) {

      to: oylikLocalDate(now),

      listFrom: (storage.get('oylik_list_from') || {}).value || '',
      listTo: (storage.get('oylik_list_to') || {}).value || ''
    };
  }
  return state.oylik;
}

function oylikUsd(n) {
  return n === null || n === undefined ? '—' : '$' + Number(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function oylikUzs(n) {
  return n === null || n === undefined ? '—' : Math.round(Number(n)).toLocaleString('ru-RU') + ' so‘m';
}
function oylikNarx(narx, valyuta) {
  if (narx === null || narx === undefined) return '<span style="color:#DC2626;font-weight:700;">narx yo‘q</span>';
  return valyuta === 'USD' ? oylikUsd(narx) : oylikUzs(narx);
}

function openOylik() {
  const O = oylikState();
  O.loaded = false; O.report = null; O.detail = null;
  switchTab('oylik');
}

async function loadOylikData() {
  const O = oylikState();
  O.loading = true;
  try {
    const [r, p] = await Promise.all([apiCall('/api/salary/rates', { overlay: 'Yuklanmoqda...' }), apiCall('/api/salary/periods', { overlay: 'Yuklanmoqda...' })]);
    O.rates = (r && r.items) || [];
    O.periods = (p && p.items) || [];
    O.tolovYoq = !!(p && p.tolov_jadvali_yoq);
  } catch (err) {
    apiShowError(err, 'Oylik ma’lumotlarini yuklashda xato');
  }
  O.loaded = true;
  O.loading = false;
  render();
  if (O.view === 'hisob') runOylikReport();
}

function oylikSetView(v) {
  const O = oylikState();
  O.view = v; O.detail = null;
  render();
  if (v === 'hisob' && !O.report && !O.busy) runOylikReport();
}
function oylikSetBolim(v) {
  const O = oylikState();
  O.bolim = v; O.report = null;
  render();
  if (O.view === 'hisob') runOylikReport();
}
function oylikSetDate(field, v) {
  const O = oylikState();
  O[field] = v; O.report = null;
  render();
  if (O.view === 'hisob') runOylikReport();
}
function oylikSetKurs(v) {
  const O = oylikState();
  O.kurs = v;
  storage.set('oylik_kurs', String(v));
}

function oylikRateFor(bolim, fason) {
  const O = oylikState();
  const f = String(fason).trim().toLowerCase();
  return O.rates.find(r => r.bolim === bolim && String(r.fason).trim().toLowerCase() === f) || null;
}

// Fason shu bo'limdan o'tadimi? Masalan Owen shkurkadan boshlanadi, demak zborkada u yo'q.
function oylikDeptHasFason(bolim, fason) {
  const start = STAGE_SEQ.indexOf(getModelStartStage(fason));
  return STAGE_SEQ.indexOf(bolim) >= Math.max(0, start);
}

// Narx kiritiladigan fasonlar:
//  - joriy ro'yxatdagi, shu bo'limdan o'tadigan fasonlar (yangi fason qo'shilsa, o'zi paydo bo'ladi);
//  - ro'yxatdan o'chirilgan, lekin shu bo'limda narxi saqlangan fasonlar;
//  - hisobda "narx yo'q" bo'lib chiqqanlar (amalda shu bo'limda ishi bor, qoidadan qat'i nazar).
function oylikFasons() {
  const O = oylikState();
  const lc = x => String(x || '').trim().toLowerCase();
  const list = MODELS.filter(m => oylikDeptHasFason(O.bolim, m));
  const inList = new Set(list.map(lc));
  const known = new Set(MODELS.map(lc));
  O.rates.filter(r => r.bolim === O.bolim).forEach(r => {
    if (!known.has(lc(r.fason)) && !inList.has(lc(r.fason))) { inList.add(lc(r.fason)); list.push(String(r.fason).trim()); }
  });
  ((O.extra && O.extra[O.bolim]) || []).forEach(f => {
    if (lc(f) && !inList.has(lc(f))) { inList.add(lc(f)); list.push(String(f).trim()); }
  });
  return list;
}

function oylikDraft(i, field, value) {
  const O = oylikState();
  const key = O.bolim + '|' + oylikFasons()[i];
  O.draft[key] = Object.assign(O.draft[key] || {}, { [field]: value });
}

async function saveOylikRates() {
  const O = oylikState();
  const kurs = parseFloat(O.kurs);
  if (!(kurs > 0)) { alert('Yuqoridagi «standart kurs» maydoniga kursni kiriting (1 USD necha so‘m)'); return; }
  const items = [];
  oylikFasons().forEach(fason => {
    const cur = oylikRateFor(O.bolim, fason);
    const d = O.draft[O.bolim + '|' + fason] || {};
    const raw = d.narx !== undefined ? d.narx : (cur ? cur.narx : '');
    if (raw === '' || raw === null || raw === undefined) return;
    const narx = parseFloat(raw);
    if (!(narx >= 0)) return;
    items.push({ fason, narx, valyuta: d.valyuta || (cur ? cur.valyuta : 'USD') });
  });
  if (!items.length) { alert('Hech bo‘lmaganda bitta fason narxini kiriting'); return; }
  try {
    const res = await apiCall('/api/salary/rates/bulk', { method: 'PUT', body: { bolim: O.bolim, kurs_uzs_usd: kurs, items } });
    Object.keys(O.draft).forEach(k => { if (k.startsWith(O.bolim + '|')) delete O.draft[k]; });
    storage.set('oylik_kurs', String(kurs));
    const r = await apiCall('/api/salary/rates');
    O.rates = (r && r.items) || [];
    O.report = null;
    render();
    alert(`Saqlandi: ${res.changed} ta narx yangilandi` + (res.unchanged ? `, ${res.unchanged} tasi o‘zgarmagan` : ''));
  } catch (err) {
    apiShowError(err, 'Narxlarni saqlashda xato');
  }
}

let oylikReportSeq = 0;
async function runOylikReport() {
  const O = oylikState();
  if (!O.from || !O.to) { O.report = null; O.busy = false; render(); return; }
  if (O.to < O.from) {
    O.report = null; O.busy = false; render();
    alert('Tugash sanasi boshlanish sanasidan oldin bo‘lishi mumkin emas');
    return;
  }
  const seq = ++oylikReportSeq;
  O.busy = true; render();
  let rep = null, error = null;
  try {
    const q = new URLSearchParams({ bolim: O.bolim, from_date: O.from, to_date: O.to });
    rep = await apiCall('/api/salary/report?' + q.toString(), { overlay: 'Hisoblanmoqda...' });
  } catch (err) {
    error = err;
  }
  if (seq !== oylikReportSeq) return;
  O.busy = false;
  O.report = error ? null : rep;
  if (rep && (rep.missing_rates || []).length) {
    O.extra = O.extra || {};
    O.extra[O.bolim] = (O.extra[O.bolim] || []).concat(rep.missing_rates.map(m => m.fason));
  }
  render();
  if (error) apiShowError(error, 'Hisoblashda xato');
}

function oylikD(v) {
  if (!v) return '';
  const p = String(v).slice(0, 10).split('-');
  return p.length === 3 ? `${p[2]}.${p[1]}.${p[0]}` : String(v);
}

// Javobdagi davrni ochiq oynaga va ro'yxatga qo'llaydi (qayta so'rov yubormaslik uchun)
function oylikApplyDetail(res) {
  const O = oylikState();
  O.detail = res;
  O.tolovYoq = !!res.tolov_jadvali_yoq;
  const i = O.periods.findIndex(x => x.id === res.period.id);
  if (i >= 0) O.periods[i] = res.period; else O.periods.unshift(res.period);
}

async function saveOylikPeriod() {
  const O = oylikState();
  if (!confirm(`${getStageLabel(O.bolim)}: ${oylikD(O.from)} — ${oylikD(O.to)} oralig‘idagi hisob to‘lov uchun saqlansinmi?`)) return;
  try {
    const res = await apiCall('/api/salary/periods', { method: 'POST', body: { bolim: O.bolim, from_date: O.from, to_date: O.to } });
    oylikApplyDetail(res);
    O.report = null;
    O.pay = oylikPayDefaults();
    O.showFason = false;
    O.view = 'davrlar';
    render();
  } catch (err) {
    apiShowError(err, 'Hisobni saqlashda xato');
  }
}

async function openOylikPeriod(id) {
  const O = oylikState();
  try {
    const res = await apiCall('/api/salary/periods/' + encodeURIComponent(id), { overlay: 'Yuklanmoqda...' });
    oylikApplyDetail(res);
    O.pay = oylikPayDefaults();
    O.showFason = false;
    render();
  } catch (err) { apiShowError(err, 'Davrni ochishda xato'); }
}

async function deleteOylikPeriod(id) {
  const O = oylikState();
  const per = (O.detail && O.detail.period && O.detail.period.id === id) ? O.detail.period : (O.periods || []).find(x => x.id === id);
  if (!per) return;
  const title = `${getStageLabel(per.bolim)}: ${oylikD(per.boshlanish_sanasi)} — ${oylikD(per.tugash_sanasi)}`;
  const n = Number(per.tolov_soni) || 0;
  if (n > 0) {
    if (!confirm(`${title}\n\nBu hisobda ${n} ta to‘lov yozuvi bor (jami ${oylikUsd(per.tolangan_usd)}).\nHisob o‘chirilsa, to‘lov yozuvlari ham BUTUNLAY o‘chadi va qaytarib bo‘lmaydi.\n\nDavom etilsinmi?`)) return;
    if (!confirm('Ishonchingiz komilmi? Hisob va uning barcha to‘lovlari o‘chiriladi.')) return;
  } else {
    if (!confirm(`${title}\n\nBu saqlangan hisob o‘chirilsinmi?`)) return;
  }
  try {
    await apiCall('/api/salary/periods/' + encodeURIComponent(id) + (n > 0 ? '?with_payments=true' : ''), { method: 'DELETE' });
    O.periods = O.periods.filter(x => x.id !== id);
    O.detail = null;
    O.pay = null;
    O.report = null;
    render();
  } catch (err) { apiShowError(err, 'O‘chirishda xato'); }
}

// ---- to'lov formasi ----
function oylikPayDefaults() {
  return { id: null, summa: '', valyuta: (storage.get('oylik_pay_val') || {}).value || 'UZS', sana: oylikLocalDate(new Date()), izoh: '' };
}
function oylikPay() {
  const O = oylikState();
  if (!O.pay) O.pay = oylikPayDefaults();
  return O.pay;
}
function oylikPaySet(field, value) {
  const P = oylikPay();
  P[field] = value;
  if (field === 'valyuta') { storage.set('oylik_pay_val', value); P.summa = ''; render(); }
}
// Tanlangan valyutadagi qoldiq. Tahrirlash paytida o'sha to'lovning o'zi qoldiqqa qaytarib qo'shiladi.
function oylikPayRest(valyuta) {
  const O = oylikState(), P = oylikPay();
  const per = O.detail && O.detail.period;
  if (!per) return 0;
  let rest = Number(valyuta === 'USD' ? per.qolgan_usd : per.qolgan_uzs) || 0;
  if (P.id) {
    const old = (O.detail.payments || []).find(x => x.id === P.id);
    if (old) rest += Number(valyuta === 'USD' ? old.summa_usd : old.summa_uzs) || 0;
  }
  return Math.round(rest * 100) / 100;
}
function oylikPayFillRest() {
  const P = oylikPay();
  P.summa = String(oylikPayRest(P.valyuta));
  render();
}
function oylikPayEdit(id) {
  const O = oylikState();
  const old = ((O.detail && O.detail.payments) || []).find(x => x.id === id);
  if (!old) return;
  O.pay = { id: old.id, summa: String(old.summa), valyuta: old.valyuta, sana: String(old.sana).slice(0, 10), izoh: old.izoh || '' };
  render();
  setTimeout(() => { const el = document.getElementById('oylikPayForm'); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 50);
}
function oylikPayCancel() { oylikState().pay = oylikPayDefaults(); render(); }

async function submitOylikPayment() {
  const O = oylikState(), P = oylikPay();
  const per = O.detail && O.detail.period;
  if (!per) return;
  const summa = Math.round(parseFloat(P.summa) * 100) / 100;
  if (!(summa > 0)) { alert('To‘lov summasini kiriting'); return; }
  if (!P.sana) { alert('To‘lov sanasini tanlang'); return; }
  const rest = oylikPayRest(P.valyuta);
  if (summa > rest + (P.valyuta === 'USD' ? 0.01 : 100)) {
    alert(`Summa qoldiqdan ko‘p. Qoldiq: ${P.valyuta === 'USD' ? oylikUsd(rest) : oylikUzs(rest)}`);
    return;
  }
  const body = { summa, valyuta: P.valyuta, sana: P.sana, izoh: (P.izoh || '').trim() || null };
  const wasClosed = per.status === 'tolangan';
  try {
    const res = P.id
      ? await apiCall('/api/salary/payments/' + encodeURIComponent(P.id), { method: 'PATCH', body })
      : await apiCall('/api/salary/periods/' + encodeURIComponent(per.id) + '/payments', { method: 'POST', body });
    oylikApplyDetail(res);
    O.pay = oylikPayDefaults();
    render();
    if (!wasClosed && res.period.status === 'tolangan') alert('✅ Summa to‘liq to‘landi — hisob yopildi.');
  } catch (err) {
    apiShowError(err, 'To‘lovni saqlashda xato');
  }
}

async function deleteOylikPayment(id) {
  const O = oylikState();
  const per = O.detail && O.detail.period;
  const closed = per && per.status === 'tolangan';
  if (!confirm('Bu to‘lov o‘chirilsinmi?' + (closed ? ' Hisob qayta ochiladi.' : ''))) return;
  try {
    const res = await apiCall('/api/salary/payments/' + encodeURIComponent(id), { method: 'DELETE' });
    oylikApplyDetail(res);
    if (O.pay && O.pay.id === id) O.pay = oylikPayDefaults();
    render();
  } catch (err) { apiShowError(err, 'To‘lovni o‘chirishda xato'); }
}

function oylikDeptSelect() {

  </select>`;
}

    const cur = oylikRateFor(O.bolim, m);

    return `
    <div class="card" style="padding:12px;">
      <div class="row-between">
        <b>🪑 ${esc(m)}${MODELS.includes(m) ? '' : ' <span style="font-weight:400;font-size:11px;color:var(--ink-soft);">(fasonlar ro‘yxatida yo‘q)</span>'}</b>
        ${cur ? `<span style="font-size:11px;color:var(--ink-soft);">${esc(cur.amal_boshi)} dan</span>` : `<span class="badge wait">narx yo‘q</span>`}

      <div style="display:grid; grid-template-columns:1.4fr 1fr; gap:8px; margin-top:10px;">
        <div>
          <label class="field-label">Narx</label>

          <select onchange="oylikDraft(${i},'valyuta',this.value)" style="margin-bottom:0;">

            <option value="UZS" ${val === 'UZS' ? 'selected' : ''}>So‘m</option>
          </select>
        </div>
      </div>
    </div>`;
  }).join('');
  const narxsiz = oylikFasons().filter(m => !oylikRateFor(O.bolim, m)).length;
  return `
  ${oylikDeptSelect()}
  ${narxsiz ? `<div class="card" style="background:#FEF3C7;border-color:#F59E0B;font-size:13px;padding:10px 12px;">⚠️ Bu bo‘limda <b>${narxsiz} ta</b> fasonga narx kiritilmagan.</div>` : ''}
  <div class="card" style="padding:12px;">
    <label class="field-label">Kurs (1 USD = ? so‘m) — barcha fasonlar uchun</label>
    <input type="number" min="0" step="1" value="${esc(O.kurs)}" oninput="oylikSetKurs(this.value)" placeholder="Masalan: 12900" style="margin-bottom:0;">
  </div>
  <button class="primary" style="width:100%;margin:6px 0 12px;" onclick="saveOylikRates()">💾 Hammasini saqlash</button>
  <p style="font-size:12px;color:var(--ink-soft);margin:0 2px 12px;">Narx o‘zgartirilsa, eski narx tarixda qoladi va faqat yangi ishlar uchun amal qiladi.</p>
  ${rows || `<div class="empty">Fasonlar ro'yxati bo'sh</div>`}
  ${rows ? `<button class="primary" style="width:100%;margin-top:4px;" onclick="saveOylikRates()">💾 Hammasini saqlash</button>` : ''}`;
}

function renderOylikHisob() {
  const O = oylikState();
  const rep = O.report;
  let result = '';
  if (O.busy) {
    result = `<div class="empty">⏳ Hisoblanmoqda...</div>`;
  } else if (rep) {
    const missing = rep.missing_rates || [];
    const tableRows = (rep.items || []).map(it => `
      <tr>
        <td><b>${esc(it.fason)}</b></td>
        <td><b>${it.soni}</b></td>
        <td>${oylikNarx(it.narx, it.valyuta)}</td>
        <td>${oylikUsd(it.jami_usd)}</td>
        <td>${oylikUzs(it.jami_uzs)}</td>
      </tr>`).join('');
    const sp = rep.saved_period;
    const today = oylikLocalDate(new Date());
    const future = O.to > today;
    const changed = !!sp && (Number(rep.jami_soni) !== Number(sp.jami_soni) || Math.abs(Number(rep.jami_usd) - Number(sp.jami_usd)) > 0.01);

    result = `
    ${missing.length ? `
    <div class="card" style="background:#FEE2E2;border-color:#EF4444;">
      <b style="color:#B91C1C;">⚠️ Narxi belgilanmagan fasonlar:</b>
      <div style="margin-top:6px;font-size:13px;">${missing.map(m => `${esc(m.fason)} (${m.soni} dona)`).join(', ')}</div>
      <button class="secondary" style="width:100%;margin-top:10px;" onclick="oylikSetView('narx')">Narxlarni kiritish →</button>
    </div>` : ''}
    ${(rep.items || []).length === 0 ? `<div class="empty">Tanlangan davrda bajarilgan ish topilmadi</div>` : `
    <div class="card" style="padding:12px;">
      <div style="max-height:360px;overflow:auto;">
        <table class="clean-table">
          <thead><tr><th>Fason</th><th>Soni</th><th>Narx</th><th>Jami $</th><th>Jami so‘m</th></tr></thead>
          <tbody>${tableRows}</tbody>
        </table>
      </div>
    </div>
    <div class="total-summary"><span class="label">Jami bajarilgan:</span><span class="number">${rep.jami_soni} dona</span></div>
    <div class="total-summary" style="background:#D1FAE5;border-color:#10B981;margin-top:8px;">
      <span class="label" style="color:#065F46;">💵 Jami (USD):</span><span class="number" style="color:#065F46;">${oylikUsd(rep.jami_usd)}</span>
    </div>
    <div class="total-summary" style="background:#EFF6FF;border-color:#2563EB;margin-top:8px;">
      <span class="label" style="color:#1E40AF;">💴 Jami (so‘m):</span><span class="number" style="color:#1E40AF;">${oylikUzs(rep.jami_uzs)}</span>
    </div>
    ${future ? `<div class="card" style="${warn}"><b>⏳ Tugash sanasi hali kelmagan.</b> Bu oraliqni to‘lovga saqlab bo‘lmaydi: keyingi kunlarda bajariladigan ishlar hisobga kirmay qolardi. Tugash sanasini bugungi yoki undan oldingi kunga qo‘ying.</div>` : ''}
    ${!future && !sp && O.to === today ? `<div class="card" style="${warn}">ℹ️ Tugash sanasi — bugun. Bugun kechroq yopiladigan ishlar bu hisobga kirmay qoladi, shuning uchun kun oxirida saqlagan ma’qul.</div>` : ''}
    ${changed ? `<div class="card" style="${warn}"><b>⚠️ Saqlangandan keyin ma’lumot o‘zgargan.</b><br>Hozir: <b>${rep.jami_soni}</b> dona, <b>${oylikUsd(rep.jami_usd)}</b>. Saqlangan: <b>${sp.jami_soni}</b> dona, <b>${oylikUsd(sp.jami_usd)}</b>.<br>${sp.tolov_soni === 0 ? 'To‘lov qilinmagan — «Qayta hisoblab saqlash» bilan yangilash mumkin.' : 'To‘lov boshlangani uchun saqlangan hisob o‘zgarmaydi.'}</div>` : ''}
    ${sp ? `
    <div class="card" style="margin-top:12px;">
      <div class="row-between"><b>Bu hisob saqlangan</b>${oylikStatusBadge(sp.status)}</div>
      <div style="margin:10px 0 6px;">${oylikProgress(sp)}</div>
      <div style="font-size:12px;color:var(--ink-soft);">To‘langan: <b>${oylikUsd(sp.tolangan_usd)}</b> &middot; Qoldiq: <b>${oylikUsd(sp.qolgan_usd)}</b> (${oylikUzs(sp.qolgan_uzs)})</div>
      <button class="primary" style="width:100%;margin-top:10px;" onclick="oylikSetView('davrlar');openOylikPeriod('${esc(sp.id)}')">💵 To‘lovlarga o‘tish →</button>
      ${sp.tolov_soni === 0 && !missing.length && !future ? `<button class="secondary" style="width:100%;margin-top:8px;" onclick="saveOylikPeriod()">🔄 Qayta hisoblab saqlash</button>` : ''}
    </div>` : ''}
    ${!sp && !missing.length && !future ? `
      <button class="primary" style="width:100%;margin-top:12px;" onclick="saveOylikPeriod()">💾 Saqlash va to‘lovga o‘tkazish</button>` : ''}

    <div><label class="field-label">Tugash sanasi</label><input type="date" value="${esc(O.to)}" onchange="oylikSetDate('to',this.value)"></div>
  </div>
  ${result}`;

function oylikProgress(per) {
  const pct = Math.max(0, Math.min(100, Number(per.foiz) || 0));
  const color = per.status === 'tolangan' ? '#10B981' : '#2563EB';
  return `<div style="height:10px;background:#E2E8F0;border-radius:100px;overflow:hidden;"><div style="height:100%;width:${pct}%;background:${color};border-radius:100px;transition:width .3s;"></div></div>`;
}

// ================= ARXIV (server tomonida; muddati sozlanadi, avtomatik yoki qo'lda) =================
// Quyidagi funksiyalar fayl boshidagi eski (brauzerda hisoblaydigan) nusxalarini almashtiradi.
const ARXIV_PRESETS = [15, 30, 45, 60, 90, 180];

function arxivState() {
  if (!state.arxiv) state.arxiv = { settings: null, loading: false, days: '', auto: false, count: null, year: 'all', dirty: false };
  return state.arxiv;
}

function arxivDaysValid() {
  const A = arxivState();
  const d = parseInt(A.days, 10);
  const min = (A.settings && A.settings.min_days) || 7, max = (A.settings && A.settings.max_days) || 3650;
  return (d >= min && d <= max) ? d : null;
}

async function loadArxivSettings() {
  const A = arxivState();
  A.loading = true;
  try {
    const res = await apiCall('/api/arxiv/settings');
    A.settings = res; A.days = String(res.days); A.auto = !!res.auto; A.count = res.candidates; A.dirty = false; A.serverError = '';
  } catch (err) {
    A.settings = A.settings || { days: 30, auto: false, min_days: 7, max_days: 3650, failed: true };
    A.serverError = arxivErrText(err);
  }
  A.loading = false;
  render();
}

// Server arxiv so'rovini tanimasa (404) — odatda server yangi kod bilan qayta ishga tushirilmagan bo'ladi.
function arxivErrText(err) {
  if (err && err.status === 404) return 'Server arxiv funksiyasini tanimayapti. Serverni to‘xtatib (Ctrl+C), qayta ishga tushiring, so‘ng sahifani yangilang.';
  return 'Server javob bermadi: ' + ((err && err.message) || 'noma’lum xato');
}

let arxivCountSeq = 0;
async function arxivRefreshCount() {
  const A = arxivState();
  const d = arxivDaysValid();
  if (!d) { A.count = null; render(); return; }
  const seq = ++arxivCountSeq;
  try {
    const res = await apiCall('/api/arxiv/candidates?days=' + d);
    if (seq !== arxivCountSeq) return;
    A.count = (res.items || []).length;
    A.serverError = '';
  } catch (err) {
    if (seq !== arxivCountSeq) return;
    A.count = null;
    A.serverError = arxivErrText(err);
  }
  render();
}

function arxivSetDays(v) {
  const A = arxivState();
  A.days = String(v); A.dirty = true; A.count = null;
  render();
  arxivRefreshCount();
}
function arxivToggleAuto() { const A = arxivState(); A.auto = !A.auto; A.dirty = true; render(); }

async function saveArxivSettings() {
  const A = arxivState();
  const d = arxivDaysValid();
  if (!d) { alert(`Kunlar soni ${(A.settings && A.settings.min_days) || 7} dan kam bo‘lmasligi kerak`); return; }
  try {
    const res = await apiCall('/api/arxiv/settings', { method: 'PUT', body: { days: d, auto: A.auto } });
    A.settings = res; A.days = String(res.days); A.auto = !!res.auto; A.count = res.candidates; A.dirty = false;
    render();
    alert(res.auto
      ? `Saqlandi. Tugaganiga ${res.days} kundan oshgan konverlar kuniga bir marta avtomatik arxivga o‘tadi.`
      : `Saqlandi. Avtomatik arxivlash o‘chiq — faqat «Hozir arxivlash» tugmasi bilan.`);
  } catch (err) { apiShowError(err, 'Sozlamani saqlashda xato'); }
}

async function openArchivePreview() {
  const d = arxivDaysValid();
  if (!d) { alert('Avval kunlar sonini to‘g‘ri kiriting'); return; }
  try {
    const res = await apiCall('/api/arxiv/candidates?days=' + d, { overlay: 'Yuklanmoqda...' });
    state.archivePreviewModal = { candidates: res.items || [], days: res.days };
    render();
  } catch (err) { apiShowError(err, 'Ro‘yxatni yuklashda xato'); }
}

async function confirmManualArchive() {
  const m = state.archivePreviewModal;
  if (!m || !m.candidates.length) { state.archivePreviewModal = null; render(); return; }
  try {
    const res = await apiCall('/api/arxiv/run', { method: 'POST', body: { days: m.days } });
    state.archivePreviewModal = null;
    await syncFromSheets(true);
    await loadArxivSettings();
    alert(`${res.archived} ta konver arxivga o‘tkazildi.`);
  } catch (err) {
    apiShowError(err, 'Arxivlash bajarilmadi');
    await syncFromSheets(true);
  }
}

async function restoreArchived(id) {
  const A = arxivState();
  const days = (A.settings && A.settings.days) || 30;
  if (!confirm(`«${id}» konveri faol ro‘yxatga qaytarilsinmi?\n\nU ${days} kun davomida avtomatik qayta arxivlanmaydi.`)) return;
  try {
    await apiCall('/api/arxiv/' + encodeURIComponent(id) + '/restore', { method: 'POST', body: {} });
    await syncFromSheets(true);
    arxivRefreshCount();
  } catch (err) { apiShowError(err, 'Arxivdan qaytarib bo‘lmadi'); }
}

function renderArxivSettings() {
  const A = arxivState();
  if (!A.settings) return `<div class="card"><div class="empty" style="padding:10px;">⏳ Sozlamalar yuklanmoqda...</div></div>`;
  const d = arxivDaysValid();
  const countText = !d ? `<span style="color:#B91C1C;">Kunlar sonini kiriting (kamida ${A.settings.min_days})</span>`
    : (A.serverError ? '' : (A.count === null ? '⏳ hisoblanmoqda...' : `Shu qoida bo‘yicha hozir <b>${A.count} ta</b> konver arxivga o‘tadi.`));
  return `

function arxivYearOf(o) { return String(o.completed_at || o.archived_at || o.sana || '').slice(0, 4); }

// Arxiv ro'yxati (yil va qidiruv bo'yicha filtrlangan kartalar)
function arxivListHtml() {
  const l = L(), A = arxivState();
  const isAdminArxiv = state.user && state.user.bolim === 'admin';
  const all = state.archive || [];
  if (all.length === 0) return `<div class="empty">🗄 Arxivda konver yo‘q</div>`;
  const search = String(state.archiveSearch || '').trim().toLowerCase();
  const list = all
    .filter(o => A.year === 'all' || arxivYearOf(o) === A.year)
    .filter(o => !search || String(o.id).toLowerCase().includes(search) || String(o.model).toLowerCase().includes(search))
    .sort((a, b) => String(b.completed_at || '').localeCompare(String(a.completed_at || '')));
  if (list.length === 0) return `<div class="empty">Mos konver topilmadi</div>`;
  return list.map(o => {
    const stages = (o.partiyalar || []).filter(p => p.bosqich === 'ombor').map(p => `${p.soni} dona${p.rang ? ' · ' + esc(p.rang) : ''}`).join(', ');
    return `

function renderArxiv() {
  const A = arxivState();
  const isAdminArxiv = state.user && state.user.bolim === 'admin';
  if (isAdminArxiv && !A.settings && !A.loading) loadArxivSettings();

  const all = state.archive || [];
  const perYear = {};
  all.forEach(o => { const y = arxivYearOf(o); if (y) perYear[y] = (perYear[y] || 0) + 1; });

function stState() {
  if (!state.st) state.st = {
    cat: (storage.get('st_cat') || {}).value || 'prod',
    sub: (storage.get('st_sub') || {}).value || 'hisobot',
    bolim: 'zborka', model: 'all', gran: 'oy', offset: 0,
    kirim: null, kirimAt: 0, kirimLoading: false, kirimError: false
  };
  if (!ST_GRAN[state.st.gran]) state.st.gran = 'oy';
  return state.st;
}
function stSet(key, value) {
  const S = stState();
  S[key] = value;
  if (key === 'cat') storage.set('st_cat', value);
  if (key === 'sub') storage.set('st_sub', value);
  if (key !== 'sub') S.offset = 0;
  render();
}
function stShift(d) { const S = stState(); S.offset = Math.max(0, S.offset + d); render(); }

// ---- formatlash ----
function stInt(n) { return Math.round(Number(n) || 0).toLocaleString('ru-RU'); }
function stUsd(n) { return '$' + stInt(n); }
function stK(v) {
  v = Number(v) || 0;
  if (v >= 1e6) return '$' + (v / 1e6).toFixed(1).replace('.0', '') + 'M';
  if (v >= 10000) return '$' + Math.round(v / 1000) + 'K';
  if (v >= 1000) return '$' + (v / 1000).toFixed(1).replace('.0', '') + 'K';
  return '$' + Math.round(v);
}
function stNum(v) { v = Number(v) || 0; return v >= 10000 ? Math.round(v / 1000) + 'K' : String(Math.round(v)); }
function stNiceMax(v) {
  // Shkala tepasi: 4 ga bo'linganda "chiroyli" sonlar chiqadigan qiymatlar (3-6-9-12, 15-30-45-60, 25-50-75-100 ...)
  if (!(v > 4)) return 4;
  if (v <= 8) return 8;
  if (v <= 12) return 12;
  const e = Math.pow(10, Math.floor(Math.log10(v)));
  for (const m of [1.2, 2, 4, 6, 8, 10]) if (m * e >= v) return m * e;
  return 10 * e;
}
function stP2(n) { return String(n).padStart(2, '0'); }

// ---- davr oynasi: kunlar / oylar / yillar ----
function stWindow(gran, offset, shift) {
  shift = shift || 0; // oyna shuncha bo'lak oldinga suriladi (grafik chapdan boshlanishi uchun)
  const now = new Date(), buckets = [];
  let prevStart;
  if (gran === 'kun') {
    const end = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1 - offset * 30);
    for (let i = 30; i >= 1; i--) {
      const a = new Date(end.getFullYear(), end.getMonth(), end.getDate() - i);
      buckets.push({ a, b: new Date(a.getFullYear(), a.getMonth(), a.getDate() + 1),
        label: `${stP2(a.getDate())}.${stP2(a.getMonth() + 1)}`, full: `${stP2(a.getDate())}.${stP2(a.getMonth() + 1)}.${a.getFullYear()}` });
    }
    const s = buckets[0].a;
    prevStart = new Date(s.getFullYear(), s.getMonth(), s.getDate() - 30);
  } else if (gran === 'oy') {
    for (let i = 11; i >= 0; i--) {
      const a = new Date(now.getFullYear(), now.getMonth() - offset * 12 - i + shift, 1);
      buckets.push({ a, b: new Date(a.getFullYear(), a.getMonth() + 1, 1), label: ST_OY[a.getMonth()],
        full: `${ST_OY[a.getMonth()]} ${a.getFullYear()}`, cur: a.getFullYear() === now.getFullYear() && a.getMonth() === now.getMonth() });
    }
    const s = buckets[0].a;
    prevStart = new Date(s.getFullYear(), s.getMonth() - 12, 1);
  } else {
    for (let i = 4; i >= 0; i--) {
      const y = now.getFullYear() - offset * 5 - i + shift;
      buckets.push({ a: new Date(y, 0, 1), b: new Date(y + 1, 0, 1), label: String(y), full: y + '-yil', cur: y === now.getFullYear() });
    }
    prevStart = new Date(buckets[0].a.getFullYear() - 5, 0, 1);
  }
  const start = buckets[0].a, end = buckets[buckets.length - 1].b;
  const curIdx = buckets.findIndex(x => x.cur);
  const upto = shift > 0 && curIdx >= 0 ? curIdx : buckets.length - 1; // surilgan oynada undan keyingilari — hali kelmagan davr
  const last = buckets[upto];
  const title = gran === 'kun' ? `${buckets[0].label} — ${last.full}` : `${buckets[0].full} — ${last.full}`;
  const span = shift > 0 ? `${upto + 1} ${ST_GRAN[gran].one}` : null;
  return { buckets, start, end, prevStart, title, span, upto };
}
// Oy/Yil ko'rinishida ma'lumot oxirgi bo'laklardagina bo'lsa, ustunlar o'ng chetga yig'ilib qolardi.
// Shunda oyna ma'lumot bor birinchi oy/yildan boshlanadigan qilib suriladi (bo'sh joy o'ngda qoladi).
function stAlignLeft(w, ev) {
  const S = stState();
  if (S.gran === 'kun' || S.offset !== 0) return w;
  const k = w.buckets.findIndex(x => ev.some(e => e.t >= x.a && e.t < x.b));
  return k > 0 ? stWindow(S.gran, 0, k) : w;
}
function stSparkVals(vals, w) { const v = vals.slice(0, w.upto + 1); return v.length > 1 ? v : v.concat(v); }
function stSpanWords(w) {
  const S = stState();
  return w.span ? `${w.span} ichida` : `${S.offset === 0 ? 'Oxirgi ' : 'Tanlangan '}${ST_GRAN[S.gran].span}da`;
}

// ---- ma'lumot manbalari ----
function stProdEvents(bosqich, model) {
  const ev = [];
  state.orders.concat(state.archive || []).forEach(o => {
    if (model && model !== 'all' && o.model !== model) return;
    (o.partiyalar || []).forEach(p => {
      if (p.bosqich !== bosqich || p.holat !== 'tugadi' || !p.tugashVaqti) return;
      const t = new Date(p.tugashVaqti);
      if (!isNaN(t)) ev.push({ t, n: Number(p.soni) || 0, model: o.model || '?' });
    });
  });
  return ev;
}
function stSalesEvents(model) {
  const ev = [];
  ((state.ombor && state.ombor.chiqimlar) || []).forEach(c => {
    const t = new Date(c.vaqt);
    const m = c.model || String(c.modelKey || '').split('-')[0] || '?';
    if (isNaN(t) || (model && model !== 'all' && m !== model)) return;
    ev.push({ t, n: Number(c.soni) || 0, usd: Number(c.jamiSumma) || 0, model: m, rang: c.rang_kodi || '' });
  });
  return ev;
}
function stSum(ev, a, b, field) {
  let s = 0;
  for (const e of ev) if (e.t >= a && e.t < b) s += e[field] || 0;
  return s;
}
function stGroup(ev, a, b, keyField, valField) {
  const g = {};
  for (const e of ev) if (e.t >= a && e.t < b) g[e[keyField] || '—'] = (g[e[keyField] || '—'] || 0) + (e[valField] || 0);
  return g;
}
function stDelta(cur, prev) { return prev > 0 ? Math.round((cur - prev) * 100 / prev) : null; }

// Qo'lda (real TMO dan) omborga kirimlar faqat tarixda saqlanadi — «Ombor balansi» uchun kerak bo'lganda yuklanadi.
async function stLoadKirim() {
  const S = stState();
  if (S.kirimLoading || (S.kirim && Date.now() - S.kirimAt < 5 * 60000)) return;
  S.kirimLoading = true;
  try {
    const res = await apiCall('/api/history?department=ombor&limit=10000');
    S.kirim = ((res && res.items) || []).filter(x => x.amal === 'kirim')
      .map(x => ({ t: new Date(x.vaqt), n: Number(x.soni) || 0, model: x.model || '?' })).filter(x => !isNaN(x.t));
    S.kirimError = false;
  } catch (err) {
    S.kirim = S.kirim || [];
    S.kirimError = true;
  }
  S.kirimAt = Date.now();
  S.kirimLoading = false;
  if (state.tab === 'statistika') render();
}

// ---- bosilganda qiymat ko'rsatish (grafik ustunlari) ----
let stTipTimer = null;
function stTip(ev) {
  const text = ev.currentTarget.getAttribute('data-tip');
  let el = document.getElementById('st-tip');
  if (!el) { el = document.createElement('div'); el.id = 'st-tip'; document.body.appendChild(el); }
  el.textContent = text;
  el.style.display = 'block';
  const w = el.offsetWidth, x = Math.min(window.innerWidth - w - 8, Math.max(8, ev.clientX - w / 2));
  el.style.left = x + 'px';
  el.style.top = Math.max(8, ev.clientY - 46) + 'px';
  clearTimeout(stTipTimer);
  stTipTimer = setTimeout(() => { el.style.display = 'none'; }, 2600);
}

// ---- SVG yordamchilari ----
function stCol(x, top, w, base, fill) {
  const r = Math.min(4, Math.max(0.5, (base - top) / 2));
  return `<path d="M${x.toFixed(1)},${base} V${(top + r).toFixed(1)} Q${x.toFixed(1)},${top.toFixed(1)} ${(x + r).toFixed(1)},${top.toFixed(1)} H${(x + w - r).toFixed(1)} Q${(x + w).toFixed(1)},${top.toFixed(1)} ${(x + w).toFixed(1)},${(top + r).toFixed(1)} V${base} Z" fill="${fill}"/>`;
}

// Asosiy grafik: har davr bo'lagi uchun ustun (+ kunlik ko'rinishda 7 kunlik o'rtacha chizig'i)
function stMainChart(o) {
  const n = o.vals.length, max = Math.max.apply(null, o.vals.concat(o.avg || [0]));
  if (!(max > 0)) return `<div class="st-empty">Bu davrda ma’lumot yo‘q</div>`;
  const W = 400, H = 196, L = 36, R = o.avg ? 42 : 12, T = 18, B = 24, pw = W - L - R, ph = H - T - B, base = T + ph;
  const ymax = stNiceMax(max), y = v => T + ph - v * ph / ymax;
  const slot = pw / n, bw = Math.min(24, Math.max(4, slot * 0.72));
  const c = [`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(o.aria || '')}">`];
  for (let i = 0; i <= 4; i++) {
    const t = ymax * i / 4;
    c.push(`<line x1="${L}" x2="${W - R}" y1="${y(t).toFixed(1)}" y2="${y(t).toFixed(1)}" stroke="${i === 0 ? ST.axis : ST.grid}"/>`);
    c.push(`<text x="${L - 6}" y="${(y(t) + 3.5).toFixed(1)}" text-anchor="end" font-size="10" fill="${ST.muted}" style="font-variant-numeric:tabular-nums">${o.tick(t)}</text>`);
  }
  const step = n > 14 ? 5 : 1, maxI = o.vals.indexOf(Math.max.apply(null, o.vals));
  o.vals.forEach((v, i) => {
    const x = L + i * slot + (slot - bw) / 2, b = o.buckets[i];
    if (v > 0) c.push(stCol(x, y(v), bw, base, b.cur ? o.light : o.color));
    if (i % step === 0 || i === n - 1) c.push(`<text x="${(x + bw / 2).toFixed(1)}" y="${H - 7}" text-anchor="middle" font-size="10" fill="${ST.muted}">${b.label}</text>`);
    if (v > 0 && (i === maxI || n <= 6)) c.push(`<text x="${(x + bw / 2).toFixed(1)}" y="${(y(v) - 5).toFixed(1)}" text-anchor="middle" font-size="11" font-weight="700" fill="${ST.ink}">${o.lab(v)}</text>`);
  });
  if (o.avg) {
    const pts = o.avg.map((m, i) => `${(L + i * slot + slot / 2).toFixed(1)},${y(m).toFixed(1)}`).join(' ');
    c.push(`<polyline points="${pts}" fill="none" stroke="#fff" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>`);
    c.push(`<polyline points="${pts}" fill="none" stroke="${ST.orange}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`);
    const ex = L + (n - 1) * slot + slot / 2, ey = y(o.avg[n - 1]);
    c.push(`<circle cx="${ex.toFixed(1)}" cy="${ey.toFixed(1)}" r="4" fill="${ST.orange}" stroke="#fff" stroke-width="2"/>`);
    c.push(`<text x="${(ex + 8).toFixed(1)}" y="${(ey + 4).toFixed(1)}" font-size="11" font-weight="700" fill="${ST.ink}">${o.lab(o.avg[n - 1])}</text>`);
  }
  // bosish/ustiga borish uchun ko'rinmas zonalar (ustundan kengroq)
  o.vals.forEach((v, i) => {
    const tip = `${o.buckets[i].full}: ${o.tip(v)}`;
    c.push(`<rect class="st-hit" x="${(L + i * slot).toFixed(1)}" y="${T}" width="${slot.toFixed(1)}" height="${ph}" fill="transparent" data-tip="${esc(tip)}" onclick="stTip(event)"><title>${esc(tip)}</title></rect>`);
  });
  c.push('</svg>');
  return c.join('');
}

function stSpark(vals) {
  const W = 380, H = 58, mx = Math.max.apply(null, vals) || 1, n = vals.length;
  const xs = vals.map((_, i) => i * W / (n - 1)), ys = vals.map(v => H - 8 - v * (H - 16) / mx);
  const pts = xs.map((x, i) => `${x.toFixed(1)},${ys[i].toFixed(1)}`).join(' ');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="58" preserveAspectRatio="none" style="display:block" aria-hidden="true">
    <polygon points="0,${H} ${pts} ${W},${H}" fill="#fff" opacity=".13"/>
    <polyline points="${pts}" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" opacity=".95" vector-effect="non-scaling-stroke"/></svg>`;
}

// Oxirgi oylar (ma'lumot bor birinchi oydan boshlab, ko'pi bilan 6 ta)
function stRecentMonths(ev) {
  const now = new Date(), out = [];
  for (let i = 5; i >= 0; i--) {
    const a = new Date(now.getFullYear(), now.getMonth() - i, 1);
    out.push({ a, b: new Date(a.getFullYear(), a.getMonth() + 1, 1), label: ST_OY[a.getMonth()], full: `${ST_OY[a.getMonth()]} ${a.getFullYear()}`, cur: i === 0 });
  }
  while (out.length > 1 && !ev.some(e => e.t >= out[0].a && e.t < out[0].b)) out.shift();
  return out;
}

function stMonthChart(months, vals, color, light, lab, sub) {
  const max = Math.max.apply(null, vals);
  if (!(max > 0)) return `<div class="st-empty">Ma’lumot yo‘q</div>`;
  const W = 196, H = sub ? 172 : 160, L = 6, T = 22, B = sub ? 34 : 22, ph = H - T - B, base = T + ph;
  const slot = (W - 2 * L) / months.length, bw = Math.min(24, slot - 8);
  const c = [`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img">`, `<line x1="${L}" x2="${W - L}" y1="${base}" y2="${base}" stroke="${ST.axis}"/>`];
  months.forEach((m, i) => {
    const v = vals[i], x = L + i * slot + (slot - bw) / 2, top = base - v * ph / max;
    if (v > 0) c.push(stCol(x, top, bw, base, m.cur ? light : color));
    c.push(`<text x="${(x + bw / 2).toFixed(1)}" y="${(top - 5).toFixed(1)}" text-anchor="middle" font-size="${months.length > 4 ? 9.5 : 11}" font-weight="700" fill="${ST.ink}">${lab(v)}</text>`);
    c.push(`<text x="${(x + bw / 2).toFixed(1)}" y="${base + 14}" text-anchor="middle" font-size="10.5" fill="${ST.muted}">${m.label}${m.cur ? '*' : ''}</text>`);
    if (sub) c.push(`<text x="${(x + bw / 2).toFixed(1)}" y="${base + 27}" text-anchor="middle" font-size="9" fill="${ST.muted}">${sub(i)}</text>`);
  });
  c.push('</svg>');
  return c.join('');
}

function stHBars(items, color, val, extra, scale) {
  if (!items.length) return `<div class="st-empty">Bu davrda ma’lumot yo‘q</div>`;
  const max = Math.max.apply(null, items.map(x => x[1])) || 1;
  return items.map(([name, v]) => `
    <div class="st-hrow"><div class="st-hname">${esc(name)}</div><div class="st-htrack">
      <div class="st-hbar" style="width:${Math.max(1, v * 100 / max * (scale || 0.74)).toFixed(1)}%;background:${color}"></div>
      <span class="st-hval">${val(v)}</span>${extra ? `<span class="st-hex">${extra(name)}</span>` : ''}</div></div>`).join('');
}

function stTop(group, n) { return Object.entries(group).filter(x => x[1] > 0).sort((a, b) => b[1] - a[1]).slice(0, n); }

function stHero(o) {
  const S = stState(), G = ST_GRAN[S.gran];
  const d = o.delta === null ? '' : `<span class="st-delta">${o.delta >= 0 ? '▲' : '▼'} ${Math.abs(o.delta)}% <i>${G.prev}</i></span>`;
  return `
  <div class="st-hero">
    <div class="st-nav">
      <button onclick="stShift(1)" title="Oldingi davr">‹</button>
      <span>${o.title} · ${o.span || ((S.offset === 0 ? 'oxirgi ' : '') + G.span)}</span>
      <button onclick="stShift(-1)" title="Keyingi davr" ${S.offset === 0 ? 'disabled' : ''}>›</button>
    </div>
    <div class="st-hlab">${o.label}</div>
    <div class="st-hnum">${o.value}</div>
    ${d}
    <div class="st-spark">${stSpark(o.spark)}</div>
    <div class="st-chips">${o.chips.map(c => `<div><span>${c[0]}</span><b>${c[1]}</b></div>`).join('')}</div>
  </div>`;
}
function stDeltaWords(delta) {
  const G = ST_GRAN[stState().gran];
  return delta === null ? '' : `, bu ${G.than} <b>${Math.abs(delta)}% ${delta >= 0 ? 'ko‘p' : 'kam'}</b>`;
}
function stFilters(selectHtml) {
  const S = stState();
  return `<div class="st-row">${selectHtml}
    <div class="st-seg">${Object.keys(ST_GRAN).map(g => `<div class="${S.gran === g ? 'on' : ''}" onclick="stSet('gran','${g}')">${ST_GRAN[g].tab}</div>`).join('')}</div></div>`;
}
function stCardHead(icon, title, sub) {
  return `<div class="st-ch"><div class="st-ic">${icon}</div><div><h3>${title}</h3><div class="st-subt">${sub}</div></div></div>`;
}

// ---------------------------------------------------------------- ISHLAB CHIQARISH -> TENDENSIYA
function renderStatTrend() {
  const S = stState(), G = ST_GRAN[S.gran];
  const ev = stProdEvents(S.bolim);
  const w = stAlignLeft(stWindow(S.gran, S.offset), ev);
  const vals = w.buckets.map(b => stSum(ev, b.a, b.b, 'n'));
  const total = vals.reduce((a, b) => a + b, 0), delta = stDelta(total, stSum(ev, w.prevStart, w.start, 'n'));
  const active = vals.filter(v => v > 0).length, best = Math.max.apply(null, vals), bestB = w.buckets[vals.indexOf(best)];
  const avg = S.gran === 'kun' ? w.buckets.map(b => stSum(ev, new Date(b.b.getTime() - 7 * 86400000), b.b, 'n') / 7) : null;
  const fas = stTop(stGroup(ev, w.start, w.end, 'model', 'n'), 8);
  const dept = getStageLabel(S.bolim);
  const select = `<select onchange="stSet('bolim',this.value)">${ST_DEPTS.map(d => `<option value="${d}" ${S.bolim === d ? 'selected' : ''}>${esc(getStageLabel(d))}</option>`).join('')}</select>`;

  const months = stRecentMonths(ev), mvals = months.map(m => stSum(ev, m.a, m.b, 'n'));
  const yearNow = new Date().getFullYear(), yearTotal = stSum(ev, new Date(yearNow, 0, 1), new Date(yearNow + 1, 0, 1), 'n');

  const insight = total > 0
    ? `<b>📌 Xulosa.</b> ${stSpanWords(w)} ${esc(dept.toLowerCase())} <b>${stInt(total)} dona</b> bajardi${stDeltaWords(delta)}.
       ${fas.length ? `Eng ko‘p ishlangan fason — <b>${esc(fas[0][0])}</b> (${stInt(fas[0][1])} dona).` : ''} Eng unumli ${G.one}: <b>${bestB.full}</b> (${stInt(best)} dona).`
    : `<b>📌 Xulosa.</b> Bu davrda ${esc(dept.toLowerCase())} bo‘limida bajarilgan ish yo‘q.`;

  return `
  ${stFilters(select)}
  ${stHero({ title: w.title, span: w.span, label: 'Bajarilgan stullar', value: `${stInt(total)} <small>dona</small>`, delta, spark: avg || stSparkVals(vals, w),
    chips: [[G.avgL, `${stInt(active ? total / active : 0)} dona`],
            [`Eng yaxshi ${G.one}`, best > 0 ? `${stInt(best)} · ${bestB.label}` : '—'],
            [G.actL, `${active} ${G.one}`]] })}
  <div class="st-insight">${insight}</div>

  <div class="st-card">${stCardHead('📈', `${G.chart} ishlab chiqarish`, `${esc(dept)}, dona · ustunni bosing`)}
    ${avg ? `<div class="st-legend"><span><i class="st-sw" style="background:${ST.blue}"></i>Kunlik</span><span><i class="st-ln"></i>7 kunlik o‘rtacha</span></div>` : ''}
    ${stMainChart({ buckets: w.buckets, vals, avg, color: ST.blue, light: ST.blueL, tick: t => stNum(t), lab: v => stNum(v), tip: v => stInt(v) + ' dona', aria: 'Ishlab chiqarish grafigi' })}
    ${!avg && S.offset === 0 ? `<div class="st-note">Och rangdagi ustun — hali tugamagan ${G.one}</div>` : ''}
  </div>

  ${S.gran === 'kun' ? `
  <div class="st-card">${stCardHead('🗓', 'Oylar va yil', 'Bajarilgan stullar, dona')}
    <div class="st-two"><div>${stMonthChart(months, mvals, ST.blue, ST.blueL, stNum)}<div class="st-note">* joriy oy hali tugamagan</div></div>
      <div class="st-big"><span>${yearNow}-yil boshidan</span><b>${stInt(yearTotal)}</b><em>dona</em></div></div>
  </div>` : ''}

  <div class="st-card">${stCardHead('🪑', 'Fasonlar kesimida', 'Tanlangan davrda bajarilgan, dona')}
    ${stHBars(fas, ST.blue, stInt)}</div>`;
}

// ---------------------------------------------------------------- SOTUV
function stBalanceChart(months, kirim, chiqim) {
  const max = Math.max.apply(null, kirim.concat(chiqim));
  if (!(max > 0)) return `<div class="st-empty">Ma’lumot yo‘q</div>`;
  const W = 400, H = 178, L = 10, T = 22, B = 40, ph = H - T - B, base = T + ph;
  const slot = (W - 2 * L) / months.length, bw = Math.min(24, slot / 2 - 7);
  const c = [`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Ombor balansi">`, `<line x1="${L}" x2="${W - L}" y1="${base}" y2="${base}" stroke="${ST.axis}"/>`];
  months.forEach((m, i) => {
    const cx = L + i * slot + slot / 2, net = kirim[i] - chiqim[i];
    [[kirim[i], ST.blue], [chiqim[i], ST.aqua]].forEach(([v, color], j) => {
      const x = cx - bw - 1 + j * (bw + 2), top = base - v * ph / max;
      if (v > 0) c.push(stCol(x, top, bw, base, color));
      c.push(`<text x="${(x + bw / 2).toFixed(1)}" y="${(top - 5).toFixed(1)}" text-anchor="middle" font-size="${months.length > 4 ? 9 : 10.5}" font-weight="700" fill="${ST.ink}">${stNum(v)}</text>`);
    });
    c.push(`<text x="${cx.toFixed(1)}" y="${base + 14}" text-anchor="middle" font-size="10.5" fill="${ST.muted}">${m.label}${m.cur ? '*' : ''}</text>`);
    c.push(`<text x="${cx.toFixed(1)}" y="${base + 30}" text-anchor="middle" font-size="11" font-weight="700" fill="${ST.ink2}">${net >= 0 ? '▲ +' : '▼ −'}${stInt(Math.abs(net))}</text>`);
    const tip = `${m.full}: kirdi ${stInt(kirim[i])}, sotildi ${stInt(chiqim[i])}`;
    c.push(`<rect class="st-hit" x="${(L + i * slot).toFixed(1)}" y="${T}" width="${slot.toFixed(1)}" height="${ph}" fill="transparent" data-tip="${esc(tip)}" onclick="stTip(event)"><title>${esc(tip)}</title></rect>`);
  });
  c.push('</svg>');
  return c.join('');
}

function renderStatSales() {
  const S = stState(), G = ST_GRAN[S.gran];
  if (!S.kirimLoading && (!S.kirim || Date.now() - S.kirimAt > 5 * 60000)) stLoadKirim();
  const ev = stSalesEvents(S.model);
  const w = stAlignLeft(stWindow(S.gran, S.offset), ev);
  const vals = w.buckets.map(b => stSum(ev, b.a, b.b, 'usd'));
  const total = vals.reduce((a, b) => a + b, 0), qty = stSum(ev, w.start, w.end, 'n');
  const delta = stDelta(total, stSum(ev, w.prevStart, w.start, 'usd'));
  const best = Math.max.apply(null, vals), bestB = w.buckets[vals.indexOf(best)];
  const avg = S.gran === 'kun' ? w.buckets.map(b => stSum(ev, new Date(b.b.getTime() - 7 * 86400000), b.b, 'usd') / 7) : null;
  const fUsd = stGroup(ev, w.start, w.end, 'model', 'usd'), fQty = stGroup(ev, w.start, w.end, 'model', 'n');
  const fas = stTop(fUsd, 8), colors = stTop(stGroup(ev, w.start, w.end, 'rang', 'n'), 5);
  const models = Array.from(new Set(MODELS.concat(stSalesEvents('all').map(e => e.model))));
  const select = `<select onchange="stSet('model',this.value)"><option value="all" ${S.model === 'all' ? 'selected' : ''}>Barcha fasonlar</option>${models.map(m => `<option value="${esc(m)}" ${S.model === m ? 'selected' : ''}>${esc(m)}</option>`).join('')}</select>`;

  const months = stRecentMonths(ev), musd = months.map(m => stSum(ev, m.a, m.b, 'usd')), mqty = months.map(m => stSum(ev, m.a, m.b, 'n'));
  const yearNow = new Date().getFullYear(), y0 = new Date(yearNow, 0, 1), y1 = new Date(yearNow + 1, 0, 1);

  // Ombor balansi: kirim = ishlab chiqarishdan omborga kirgan + qo'lda kirim; chiqim = sotilgan
  const inEv = stProdEvents('ombor', S.model).concat((S.kirim || []).filter(e => S.model === 'all' || e.model === S.model));
  const balMonths = stRecentMonths(ev.concat(inEv));
  const kirim = balMonths.map(m => stSum(inEv, m.a, m.b, 'n')), chiqim = balMonths.map(m => stSum(ev, m.a, m.b, 'n'));
  let stockN = 0, stockV = 0;
  Object.values((state.ombor && state.ombor.zaxira) || {}).forEach(z => {
    if (S.model !== 'all' && z.model !== S.model) return;
    stockN += Number(z.soni) || 0; stockV += (Number(z.soni) || 0) * (Number(z.narx) || 0);
  });

  const insight = total > 0
    ? `<b>📌 Xulosa.</b> ${stSpanWords(w)} <b>${stInt(qty)} dona</b> stul <b>${stUsd(total)}</b> ga sotildi${stDeltaWords(delta)}.
       ${fas.length && S.model === 'all' ? `Summa bo‘yicha eng ko‘p sotilgan fason — <b>${esc(fas[0][0])}</b> (${stK(fas[0][1])}).` : ''}
       ${best > 0 ? `Eng yaxshi ${G.one}: <b>${bestB.full}</b> (${stUsd(best)}).` : ''}`
    : `<b>📌 Xulosa.</b> Bu davrda ombordan chiqim bo‘lmagan.`;

  return `
  ${stFilters(select)}
  ${stHero({ title: w.title, span: w.span, label: 'Sotuv summasi (ombordan chiqim)', value: stUsd(total), delta, spark: avg || stSparkVals(vals, w),
    chips: [['Sotilgan', `${stInt(qty)} dona`], ['O‘rtacha narx', qty > 0 ? `${stUsd(total / qty)} / dona` : '—'],
            [`Eng yaxshi ${G.one}`, best > 0 ? `${stK(best)} · ${bestB.label}` : '—']] })}
  <div class="st-insight">${insight}</div>

  <div class="st-card">${stCardHead('💵', `${G.chart} sotuv`, 'Ombordan chiqim, AQSH dollari · ustunni bosing')}
    ${avg ? `<div class="st-legend"><span><i class="st-sw" style="background:${ST.aqua}"></i>Kunlik</span><span><i class="st-ln"></i>7 kunlik o‘rtacha</span></div>` : ''}
    ${stMainChart({ buckets: w.buckets, vals, avg, color: ST.aqua, light: ST.aquaL, tick: t => t ? stK(t) : '0', lab: stK, tip: stUsd, aria: 'Sotuv grafigi' })}
    ${!avg && S.offset === 0 ? `<div class="st-note">Och rangdagi ustun — hali tugamagan ${G.one}</div>` : ''}
  </div>

  ${S.gran === 'kun' ? `
  <div class="st-card">${stCardHead('🗓', 'Oylar va yil', 'Sotuv summasi va sotilgan stullar')}
    <div class="st-two"><div>${stMonthChart(months, musd, ST.aqua, ST.aquaL, stK, i => stInt(mqty[i]) + ' dona')}<div class="st-note">* joriy oy hali tugamagan</div></div>
      <div class="st-big"><span>${yearNow}-yil boshidan</span><b>${stUsd(stSum(ev, y0, y1, 'usd'))}</b><em>${stInt(stSum(ev, y0, y1, 'n'))} dona sotilgan</em></div></div>
  </div>` : ''}

  ${S.model === 'all' ? `
  <div class="st-card">${stCardHead('🏆', 'Fasonlar bo‘yicha sotuv', 'Tanlangan davr: summa va sotilgan soni')}
    ${stHBars(fas, ST.aqua, stK, name => `${stInt(fQty[name] || 0)} dona`, 0.56)}</div>` : ''}

  <div class="st-card">${stCardHead('⚖️', 'Ombor balansi', 'Omborga kirgan va ombordan chiqqan stullar, dona')}

function retryArchive() { state.archiveError = false; state.archiveLoaded = false; render(); }
function stArchiveNote() {
  if (state.archiveError) return `
    <div class="st-card" style="background:#FEE2E2;font-size:13px;">
      <b style="color:#B91C1C;">⚠️ Arxiv yuklanmadi</b>

  if (!state.archiveLoaded) return `<div class="st-note" style="margin:-4px 2px 10px;">⏳ Arxiv yuklanmoqda — raqamlar hozir yangilanadi...</div>`;
  const n = (state.archive || []).length;
  return n ? `<div class="st-note" style="margin:-4px 2px 10px;">🗄 Arxivdagi <b>${n} ta</b> konver ham hisobga olingan</div>` : '';
}
function renderStatHub() {
  const S = stState();
  const sales = S.cat === 'sales', hisobot = !sales && S.sub !== 'trend';
  let body;
  if (sales) body = renderStatSales();
  else if (!hisobot) body = renderStatTrend();
  else {
    state.statEmbedded = true; // eski hisobot o'z «orqaga» tugmasini takror chizmasin
    try { body = renderStatistika(); } finally { state.statEmbedded = false; }
  }
  const head = `
    <div class="st-cats">
      <div class="st-cat ${sales ? '' : 'on'}" onclick="stSet('cat','prod')"><b>🏭</b>Ishlab chiqarish</div>
      <div class="st-cat ${sales ? 'on' : ''}" onclick="stSet('cat','sales')"><b>💰</b>Sotuv</div>
    </div>
    ${sales ? '' : `<div class="st-sub">

      <span class="${hisobot ? '' : 'on'}" onclick="stSet('sub','trend')">📈 Tendensiya</span>
    </div>`}
    ${stArchiveNote()}`;
  const cls = `st ${sales ? 'st-green' : 'st-blue'}`;
  return `${renderBackButton()}<div class="${cls}">${head}${body}</div>`;
}

// ---- bosh sahifa uchun qo'shimcha ma'lumot (oylik qarzi, so'nggi harakatlar): kerak bo'lganda, 2 daqiqada bir ----
function homeState() {
  if (!state.home) state.home = { periods: null, hist: null, at: 0, loading: false };
  return state.home;
}
async function loadHomeExtras() {
  const H = homeState();
  if (H.loading || !apiToken) return;
  H.loading = true;
  try {
    const [p, h] = await Promise.all([apiCall('/api/salary/periods'), apiCall('/api/history?limit=6')]);
    H.periods = (p && p.items) || [];
    H.hist = (h && h.items) || [];
  } catch (err) {
    H.periods = H.periods || []; H.hist = H.hist || [];
  }
  H.at = Date.now();
  H.loading = false;
  if (state.user && state.user.bolim === 'admin') render();
}
function shDebt() {
  const H = homeState();
  const src = (state.oylik && state.oylik.loaded) ? state.oylik.periods : (H.periods || []);
  const open = src.filter(p => p.status !== 'tolangan');
  return { count: open.length, usd: open.reduce((a, p) => a + (Number(p.qolgan_usd) || 0), 0) };
}

function shStats() {
  const now = Date.now(), d7 = now - 7 * 86400000, d14 = now - 14 * 86400000;
  const wip = {}; STAGE_SEQ.forEach(s => { wip[s] = 0; });
  let active = 0, oldest = null;
  state.orders.forEach(o => {
    let open = false;
    (o.partiyalar || []).forEach(p => { if (p.holat !== 'tugadi' && wip[p.bosqich] !== undefined) { wip[p.bosqich] += Number(p.soni) || 0; open = true; } });
    if (open || o.holat !== 'tayyor') {
      active++;
      const t = new Date(o.sana).getTime();
      if (!isNaN(t) && (!oldest || t < oldest.t)) oldest = { t, id: o.id };
    }
  });
  let stockN = 0, stockV = 0;
  Object.values((state.ombor && state.ombor.zaxira) || {}).forEach(z => { const n = Number(z.soni) || 0; stockN += n; stockV += n * (Number(z.narx) || 0); });
  let soldU = 0, soldN = 0, prevU = 0;
  ((state.ombor && state.ombor.chiqimlar) || []).forEach(c => {
    const t = new Date(c.vaqt).getTime();
    if (t >= d7) { soldU += Number(c.jamiSumma) || 0; soldN += Number(c.soni) || 0; } else if (t >= d14) prevU += Number(c.jamiSumma) || 0;
  });
  let made = 0, prevMade = 0;
  state.orders.concat(state.archive || []).forEach(o => (o.partiyalar || []).forEach(p => {
    if (p.bosqich !== 'ombor' || p.holat !== 'tugadi' || !p.tugashVaqti) return;
    const t = new Date(p.tugashVaqti).getTime();
    if (t >= d7) made += Number(p.soni) || 0; else if (t >= d14) prevMade += Number(p.soni) || 0;
  }));
  // O'tgan hafta bilan solishtirish faqat arxiv ham hisobga olingan bo'lsa ishonchli
  const madeDelta = (prevMade > 0 && (state.archiveLoaded || !(state.archiveCount > 0))) ? Math.round((made - prevMade) * 100 / prevMade) : null;
  const top = STAGE_SEQ.filter(s => s !== 'ombor').reduce((a, s) => (wip[s] > wip[a] ? s : a), 'zborka');
  return { wip, active, activeChairs: Object.values(wip).reduce((a, b) => a + b, 0), oldest, stockN, stockV, soldU, soldN,
           soldDelta: prevU > 0 ? Math.round((soldU - prevU) * 100 / prevU) : null, made, madeDelta, top };
}

  if (!v) return 'background:#EEF2F7;color:#94A3B8';

  if (r < 0.6) return 'background:#6da7ec;color:#fff';
  return 'background:linear-gradient(145deg,#2f7be0,#1c5cab);color:#fff';
}
function shActIcon(amal) {

  if (a.indexOf('chiqim') >= 0) return ['🚚', '#FFF1E8'];

function renderAdminHome() {
  const S = shStats(), H = homeState(), debt = shDebt(), now = new Date();

      <span>${label}</span><b>${value}</b><em>${sub}</em></div>`;

  const nodes = STAGE_SEQ.map(s => {

  if (S.oldest) alerts.push(['⏳', '#EEF4FF', '#1D4ED8', 'Eng eski ochiq konver', `${esc(S.oldest.id)} · ${Math.max(0, Math.floor((Date.now() - S.oldest.t) / 86400000))} kun`, 'Buyurtmalar', "navGo('buyurtmalar')"]);

    : `<div class="empty" style="padding:18px 6px;">✅ Hozircha e’tibor talab qiladigan narsa yo‘q</div>`;

  const hist = H.hist;
  const histHtml = hist === null
    ? `<div class="empty" style="padding:18px 6px;">⏳ Yuklanmoqda...</div>`
    : (hist.length ? hist.slice(0, 4).map(h => {
        const ic = shActIcon(h.amal), t = new Date(h.vaqt), p2 = n => String(n).padStart(2, '0');
        return `<div class="sh-ac"><div class="sh-aci" style="background:${ic[1]}">${ic[0]}</div>
          <div class="sh-act"><b>${esc(getStageLabel(h.bolim))}: ${esc(h.amal)}</b><span>${esc([h.konver && h.konver !== '-' ? h.konver : '', h.model].filter(Boolean).join(' · '))}${h.soni ? ' · ' + h.soni + ' dona' : ''}</span></div>
          <time>${p2(t.getDate())}.${p2(t.getMonth() + 1)}<br>${p2(t.getHours())}:${p2(t.getMinutes())}</time></div>`;
      }).join('') : `<div class="empty" style="padding:18px 6px;">Harakatlar yo‘q</div>`);

  return `
  <div class="sh-head">
    <div class="sh-hrow">
      <div class="sh-hi">${now.getDate()}-${SH_OY[now.getMonth()]}, ${SH_HAFTA[now.getDay()]}</div>
      <div class="sh-ctl">
        <span class="sh-net ${isOnline ? 'ok' : 'no'}">● <b>${isOnline ? 'Online' : 'Offline'}</b></span>
        <button class="sh-ref" onclick="manualRefresh()" title="Yangilash">🔄</button>
        <div class="langsw">
          <button class="${state.lang === 'uz' ? 'active' : ''}" onclick="changeLanguage('uz')">UZ</button>
          <button class="${state.lang === 'kk' ? 'active' : ''}" onclick="changeLanguage('kk')">KK</button>
        </div>
      </div>
    </div>
    <div class="sh-name">Assalomu alaykum 👋</div>
    <div class="sh-hnote">🏭 7 kunda omborga <b>${shInt(S.made)} dona</b> tayyor bo‘ldi${S.madeDelta === null ? '' : ` (${S.madeDelta >= 0 ? '+' : ''}${S.madeDelta}%)`}</div>
    ${renderOnlineStrip()}
  </div>
  <div class="sh-kpis">
    ${kpi('⚡', '#EEF4FF', 'Jarayonda', `${S.active} konver`, `${shInt(S.activeChairs)} dona`, "shGoIsh('all')")}
    ${kpi('📦', '#E7F8EF', 'Omborda', `${shInt(S.stockN)} dona`, shUsd(S.stockV), "navGo('ombor_zaxira')")}
    ${kpi('🚚', '#FFF1E8', '7 kunda sotildi', shUsd(S.soldU), `${shInt(S.soldN)} dona`, 'shGoSales()', chip(S.soldDelta))}
    ${kpi('🏭', '#F3E8FF', '7 kunda tayyor bo‘ldi', `${shInt(S.made)} dona`, 'omborga kirgan', "navGo('statistika')", chip(S.madeDelta), 'sh-k4')}
  </div>
  <div class="sh-sec"><h2>Ishlab chiqarish oqimi <a onclick="shGoIsh('all')">batafsil ›</a></h2>
    <div class="sh-card"><div class="sh-pipe">${nodes}</div><div class="sh-lg"><span>kam</span><i></i><span>ko‘p</span></div></div></div>
  <div class="sh-g2">
    <div class="sh-sec"><h2>Diqqat talab qiladi <a>${alerts.length} ta</a></h2><div class="sh-card np">${alertHtml}</div></div>
    <div class="sh-sec"><h2>So‘nggi harakatlar</h2><div class="sh-card np">${histHtml}</div></div>
  </div>`;
}
