// ================= KIM HOZIR DASTURDA (faqat boshqaruvchi, serversiz rejimda) =================
// Bosh sahifaning ko'k sarlavhasida bo'lim belgichalari (dasturdagilar yorqin, yashil nuqtali); bosilsa —
// "Foydalanuvchilar" sahifasi: har hisob, qurilmalar, oxirgi kirgan vaqti, bugungi amallar, qurilmani chiqarish.
// Ma'lumot /api/users/online dan, sahifa ochiq turganda 30 soniyada bir yangilanadi.
function onlineState() {
  if (!state.online) state.online = { items: null, at: 0, loading: false, open: {}, myId: '' };
  return state.online;
}
function onlineCount() { const O = onlineState(); return (O.items || []).filter(u => u.online).length; }
async function onlineMyId() {
  const O = onlineState();
  if (O.myId || !apiToken || !(window.crypto && crypto.subtle)) return O.myId;
  try {
    const h = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(apiToken));
    O.myId = Array.from(new Uint8Array(h)).map(b => b.toString(16).padStart(2, '0')).join('').slice(0, 16);
  } catch (e) {}
  return O.myId;
}
async function loadOnline(force) {
  const O = onlineState();
  if (!SUPABASE_URL || !apiToken || !state.user || state.user.bolim !== 'admin' || O.loading) return;
  if (!force && Date.now() - O.at < 25000) return;
  O.loading = true;
  try {
    await onlineMyId();
    const r = await apiCall('/api/users/online');
    O.items = (r && r.items) || [];
  } catch (err) { if (!O.items) O.items = []; }
  O.at = Date.now();
  O.loading = false;
  if (['menu', 'onlayn'].includes(state.tab) && !['INPUT', 'SELECT', 'TEXTAREA'].includes(document.activeElement?.tagName)) render();
}
setInterval(() => {
  if (state.user && state.user.bolim === 'admin' && ['menu', 'onlayn'].includes(state.tab) && document.visibilityState !== 'hidden') loadOnline(true);
}, 30000);

function onlineAgo(iso) {
  if (!iso) return 'hech qachon';
  const t = new Date(iso), s = Math.max(0, (Date.now() - t.getTime()) / 1000), p2 = n => String(n).padStart(2, '0');
  if (s < 75) return 'hozir';
  if (s < 3600) return Math.round(s / 60) + ' daq oldin';
  const d0 = new Date(); d0.setHours(0, 0, 0, 0);
  const hm = p2(t.getHours()) + ':' + p2(t.getMinutes());
  if (t >= d0) return 'bugun ' + hm;
  if (t >= new Date(d0.getTime() - 86400000)) return 'kecha ' + hm;
  return p2(t.getDate()) + '.' + p2(t.getMonth() + 1) + ' ' + hm;
}
function onlineName(u) { return u.department === 'admin' ? L().boshBolim : getStageLabel(u.department); }
function onlineCls(u) { return u.online ? 'on' : (u.yaqinda ? 'away' : 'off'); }

function renderOnlineStrip() {
  if (!SUPABASE_URL) return '';
  const O = onlineState();
  if (O.items === null) { setTimeout(() => loadOnline(true), 0); return '<div class="on-strip"><div class="on-tip">⏳ Kim dasturda — yuklanmoqda...</div></div>'; }
  const on = O.items.filter(u => u.online);
  return `
    <div class="on-strip" onclick="navGo('onlayn')" title="Foydalanuvchilar">
      <div class="on-avs">${O.items.map(u => `<div class="on-av ${onlineCls(u)}" title="${esc(onlineName(u))}">${BOLIM_ICON[u.department] || '🏭'}<i></i></div>`).join('')}</div>
      <div class="on-tip">${on.length ? `🟢 Hozir dasturda (${on.length}): ${on.map(u => esc(onlineName(u))).join(', ')}` : '⚪ Hozir hech kim dasturda emas'} <b>›</b></div>
    </div>`;
}

function onlineToggle(login) { const O = onlineState(); O.open[login] = !O.open[login]; render(); }
async function onlineKick(id, name) {
  if (!confirm(`«${name}» qurilmasi dasturdan chiqarilsinmi? U yerda qayta parol so'raladi.`)) return;
  try { await apiCall('/api/users/sessions/' + encodeURIComponent(id), { method: 'DELETE', overlay: 'Chiqarilmoqda...' }); await loadOnline(true); }
  catch (err) { apiShowError(err, 'Qurilmani chiqarib bo‘lmadi'); }
}

function renderOnlayn() {
  if (!SUPABASE_URL) return `<div class="empty">Bu bo‘lim faqat yangi (serversiz) versiyada ishlaydi.</div>`;
  const O = onlineState();
  if (O.items === null) { setTimeout(() => loadOnline(true), 0); return `<div class="empty">⏳ Yuklanmoqda...</div>`; }
  const on = O.items.filter(u => u.online).length;
  const rows = O.items.map(u => {
    const cls = onlineCls(u), open = !!O.open[u.login], ses = u.sessiyalar || [];
    const status = u.online ? '<b class="on-g">● dasturda</b>' : onlineAgo(u.last_seen);
    const dev = u.qurilmalar > 0 ? `${u.qurilmalar} qurilma` : (ses.length ? `${ses.length} ta kirilgan qurilma` : 'kirilmagan');
    const list = open ? `<div class="on-ses">${ses.length ? ses.map(s => {
        const me = O.myId && s.id === O.myId;
        return `<div class="on-s"><span class="on-sd ${s.online ? 'on' : ''}"></span><div><b>${esc(s.qurilma)}${me ? ' · <em>shu qurilma</em>' : ''}</b>
          <span>${s.online ? 'hozir dasturda' : 'oxirgi: ' + onlineAgo(s.last_seen)} · kirgan: ${onlineAgo(s.kirgan)}</span></div>
          ${me ? '' : `<button class="on-kick" onclick="event.stopPropagation(); onlineKick('${s.id}', '${esc(onlineName(u))} · ${esc(s.qurilma)}')">Chiqarish</button>`}</div>`;
      }).join('') : '<div class="on-none">Bu hisobga hozir hech qaysi qurilmadan kirilmagan</div>'}</div>` : '';
    return `<div class="on-row ${open ? 'open' : ''}" onclick="onlineToggle('${esc(u.login)}')">
        <div class="on-ic">${BOLIM_ICON[u.department] || '🏭'}<i class="${cls}"></i></div>
        <div class="on-nm"><b>${esc(onlineName(u))}</b><span>Bugun ${u.bugun_amallar} ta amal</span></div>
        <div class="on-st">${status}<span>${dev}</span></div><div class="on-ch">${open ? '▴' : '▾'}</div>
      </div>${list}`;
  }).join('');
  return `
    <div class="section-title">👥 Foydalanuvchilar</div>
    <div class="card on-card">
      <div class="on-sum"><span>${O.items.length} ta hisob · <b>${on}</b> tasi hozir dasturda</span><button class="secondary on-ref" onclick="loadOnline(true)">🔄</button></div>
      ${rows}
    </div>
    <div class="on-help">🟢 hozir dasturda (oxirgi 1 daqiqa) · 🟡 yaqinda bor edi (10 daqiqagacha) · ⚪ yo‘q. Qatorni bossangiz — qaysi qurilmalardan kirilgani.
      Bitta bo‘lim hisobi bir nechta telefonda ochiq bo‘lishi mumkin; keraksizini «Chiqarish» bilan yopasiz.</div>`;
}

  .fx-list{flex:1;overflow-y:auto;padding:8px 12px 16px;-webkit-overflow-scrolling:touch}
  .fx-row{background:#fff;border:1px solid var(--line);border-radius:18px;padding:12px;margin-bottom:10px}
  .fx-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .fx-id{font-size:17px;font-weight:800;letter-spacing:-.2px}
  .fx-model{font-size:13px;color:#334155;font-weight:600}
  .fx-flow{display:flex;align-items:center;gap:8px;margin:10px 0;font-size:12px;flex-wrap:wrap}
  .fx-pill{padding:6px 10px;border-radius:10px;font-weight:700}
  .fx-pill.to{background:#E7F8EF;color:#065F46} .fx-pill.from{background:#F1F5F9;color:#475569}
  .fx-flow i{font-style:normal;color:#94A3B8;font-size:15px}
  .fx-act{display:flex;gap:8px}
  .fx-act .primary{padding:13px 12px;font-size:13.5px;border-radius:14px}
  .fx-del{flex:0 0 48px;border-radius:14px;border:1px solid rgba(239,68,68,.25);background:var(--danger-bg);font-size:16px;cursor:pointer}
  @media (max-width:600px){
    .fx-ov{align-items:flex-end;padding:0}
    .fx{max-width:none;height:92vh;border-radius:26px 26px 0 0}
  }`;
  const el = document.createElement('style');
  el.textContent = css;
  document.head.appendChild(el);
})();

// Qaytarib bo'ladigan barcha bo'laklar, eng yangisi tepada (xato odatda hozirgina yopilgan konverda bo'ladi)
function fixItems() {
  const out = [];
  state.orders.forEach(o => (o.partiyalar || []).forEach(p => { const to = fixPrevStage(o, p); if (to) out.push({ o, p, to }); }));
  const ts = x => { const m = /(\d{13})/.exec(String(x.p.pid)); return m ? Number(m[1]) : 0; };
  return out.sort((a, b) => ts(b) - ts(a));
}
function fixFiltered() {
  const F = state.fixModal, items = fixItems();
  if (F.target === undefined) {
    // Bo'lim ekranidan ochilganda: avval shu bo'limga qaytadigan konverlar ko'rsatiladi
    const b = state.user && state.user.bolim;
    F.target = (b && b !== 'admin' && items.some(x => x.to === b)) ? b : 'all';
  }
  const q = String(F.search || '').trim().toLowerCase();
  const list = items.filter(x => (F.target === 'all' || x.to === F.target) &&
    (!q || String(x.o.id).toLowerCase().includes(q) || String(x.o.model).toLowerCase().includes(q)));
  return { items, list };
}
function fixCountText(n) { return n ? `${n} ta bo‘lak topildi` : ''; }
function fixRowsHtml(list) {
  if (!list.length) return `<div class="empty">Mos konver topilmadi.<br>Qidiruv yoki bo‘lim tanlovini o‘zgartirib ko‘ring.</div>`;
  return list.map(({ o, p, to }) => `
    <div class="fx-row">
      <div class="fx-top"><span class="fx-id">${esc(o.id)}</span><span class="fx-model">${esc(o.model)} &middot; ${p.soni} dona</span>${badge(p.holat)}${p.rang ? colorBadge(p.rang) : ''}</div>
      <div class="fx-flow"><span class="fx-pill to">${esc(getStageLabel(to))}</span><i>←</i><span class="fx-pill from">hozir: ${esc(getStageLabel(p.bosqich))}</span></div>
      <div class="fx-act">
        <button class="primary" onclick="adminRevertPartiya('${o.id}','${p.pid}')">⬅ ${esc(getStageLabel(to))}ga qaytarish</button>
        <button class="fx-del" onclick="adminDeletePartiya('${o.id}','${p.pid}')" title="Bu bo'lakni butunlay o'chirish (faqat takrorlanib qolgan bo'lsa)">🗑</button>
      </div>
    </div>`).join('');
}
// Yozish paytida faqat ro'yxat yangilanadi — qidiruv maydoni joyida qoladi, klaviatura yopilmaydi
function fixSearch(v) {
  if (!state.fixModal) return;
  state.fixModal.search = v;
  const r = fixFiltered();
  const rows = document.getElementById('fixRows'), cnt = document.getElementById('fixCount');
  if (rows) { rows.innerHTML = fixRowsHtml(r.list); rows.scrollTop = 0; }
  if (cnt) cnt.textContent = fixCountText(r.list.length);
}
function fixSetTarget(t) { if (state.fixModal) { state.fixModal.target = t; render(); } }

function renderFixList() {
  const F = state.fixModal, r = fixFiltered();
  const per = {};
  r.items.forEach(x => { per[x.to] = (per[x.to] || 0) + 1; });
  const chip = (val, label, n) => `<div class="fx-chip ${F.target === val ? 'on' : ''}" onclick="fixSetTarget('${val}')">${label}<small>${n}</small></div>`;
  return `
  <div class="modal-overlay fx-ov" onclick="if(event.target===this){state.fixModal=null;render();}">
    <div class="modal fx">
      <div class="fx-head">
        <div class="fx-title"><h3>🛠 Konverni orqaga qaytarish</h3><button class="fx-x" onclick="state.fixModal=null;render();" title="Yopish">✕</button></div>
        <input id="fixSearchInput" type="search" inputmode="search" autocomplete="off" autocapitalize="off" spellcheck="false"
               placeholder="Konver raqami yoki fason (masalan: 486)" value="${esc(F.search || '')}" oninput="fixSearch(this.value)">
        <div class="fx-lbl">QAYSI BO‘LIMGA QAYTARILSIN?</div>
        <div class="fx-chips">
          ${chip('all', 'Hammasi', r.items.length)}
          ${STAGE_SEQ.filter(s => per[s]).map(s => chip(s, esc(getStageLabel(s)), per[s])).join('')}
        </div>
      </div>
      <div class="fx-count" id="fixCount">${fixCountText(r.list.length)}</div>
      <div class="fx-list" id="fixRows">${fixRowsHtml(r.list)}</div>
    </div>
  </div>`;
}

// Arxiv qidiruvi ham xuddi shunday: faqat ro'yxat yangilanadi
function arxivSearch(v) {
  state.archiveSearch = v;
  const el = document.getElementById('arxivList');
  if (el) el.innerHTML = arxivListHtml();
}

loadData();
</script>
