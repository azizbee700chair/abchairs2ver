  .ticket { display: flex; align-items: stretch; gap: 12px; overflow: hidden; }

    width: 50px; flex-shrink: 0; display: flex; align-items: center; justify-content: center;

    border-radius: 10px; writing-mode: vertical-rl; text-orientation: mixed; transform: rotate(180deg);

  .model { font-weight: 700; font-size: 15px; color: var(--ink); }

  .badge.wait { background: var(--wait-bg); color: var(--wait); }
  .badge.progress { background: var(--primary-bg); color: var(--primary); }
  .badge.done { background: var(--ok-bg); color: var(--ok); }

  .actions { margin-top: 12px; display: flex; gap: 8px; }
  button.primary {
    background: var(--primary); color: #fff; border: none; border-radius: 10px; padding: 10px 16px;
    font-weight: 700; font-size: 13px; cursor: pointer; flex: 1; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
  }
  button.primary:hover { background: var(--primary-hover); }
  button.excel-btn {
    background: #10B981; color: #fff; border: none; border-radius: 10px; padding: 10px 16px;

    display: flex; align-items: center; justify-content: center; gap: 8px;
    box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2);
  }
  button.secondary {
    background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 16px; font-weight: 600; font-size: 13px; cursor: pointer; flex: 1;

  .empty { text-align: center; padding: 30px 10px; color: var(--ink-soft); font-size: 13px; }

  label.field-label { font-size: 12px; font-weight: 600; color: var(--ink-soft); display: block; margin-bottom: 4px; }

let pendingPushes = 0;
let pendingTarixPushes = 0; // tarix yozuvi uchun alohida, bloklamaydigan hisoblagich
let lastPushDoneAt = 0;
const PUSH_GRACE_MS = 6000;

let lastRawOrders = null, lastRawTarix = null, lastRawOmbor = null, lastRawArchive = null;

async function waitForPendingPushes() {
  // MUHIM: agar aynan shu payt serverga yozish (pushOrdersQueued va h.k.)
  // davom etayotgan bo'lsa, "force" bo'lsa ham ALBATTA shu yozish
  // tugashini kutamiz. Aks holda, hali yozilib ulgurmagan (masalan
  // endigina yaratilgan boshqa konver) eskirgan holat serverdan qayta
  // o'qilib, ustidan yozib yuborilishi (ya'ni yo'q bo'lib qolishi) mumkin edi.
  while (pendingPushes > 0) {
    await new Promise(r => setTimeout(r, 150));
  }
}

async function syncFromSheets(force) {
  await waitForPendingPushes();
  if (!force && (Date.now() - lastPushDoneAt) < PUSH_GRACE_MS) {
    return;
  }
  try {
    const res = await fetch(SCRIPT_URL + '?action=getAll');
    const data = await res.json();

    // MUHIM: fetch bir necha soniya davom etishi mumkin. Shu oraliqda
    // foydalanuvchi biror amal bajargan (yozish boshlangan) bo'lishi ehtimoli
    // bor — shuning uchun natijani QABUL QILISHDAN OLDIN yana bir bor
    // tekshiramiz. Aks holda hali yetib bormagan eski ma'lumot, endigina
    // qilingan o'zgarishning ustidan yozib yuborishi mumkin edi.
    await waitForPendingPushes();
    if (!force && (Date.now() - lastPushDoneAt) < PUSH_GRACE_MS) {
      return;
    }

    if (data && data.ok) {
      isOnline = true;

      // TEZKOR TEKSHIRUV: ma'lumot ko'payib borgani sayin, har 8 soniyada
      // butun ro'yxatni JSON'ga aylantirib solishtirish sekinlik keltirar
      // edi. Endi serverdan kelgan XOM matnni to'g'ridan-to'g'ri (parse
      // qilmasdan) avvalgisi bilan solishtiramiz — agar bir xil bo'lsa,
      // og'ir ishlarning (parse, dublikat tekshirish, render) BIRONTASI
      // ham bajarilmaydi.
      const ordersChanged = data.orders !== lastRawOrders;
      const tarixChanged = data.tarix !== lastRawTarix;
      const omborChanged = data.ombor !== lastRawOmbor;
      const archiveChanged = data.archive !== lastRawArchive;

      if (!ordersChanged && !tarixChanged && !omborChanged && !archiveChanged && !force) {
        return; // hech narsa o'zgarmagan — hech qanday og'ir ish qilinmaydi
      }

      if (data.fasonlar) {
        try {
          const parsed = JSON.parse(data.fasonlar);
          if (Array.isArray(parsed) && parsed.length > 0) {
            MODELS = parsed; // eski format (faqat massiv)
          } else if (parsed && Array.isArray(parsed.MODELS) && parsed.MODELS.length > 0) {
            MODELS = parsed.MODELS;
            if (parsed.MODEL_START_STAGE) MODEL_START_STAGE = parsed.MODEL_START_STAGE;
          }
        } catch (e) { /* eski formatdagi ma'lumot bo'lsa, joriy MODELS bilan davom etamiz */ }
      }

      let hadDuplicates = false;

      if (ordersChanged) {
        const newOrdersRaw = data.orders ? JSON.parse(data.orders) : [];

        // MUHIM: agar biror sabab bilan bir xil konver ID bir necha marta
        // takrorlanib qolgan bo'lsa (masalan eskirgan holatda yaratilgan bo'lsa),
        // shu yerda avtomatik aniqlab, faqat birinchisini qoldiramiz va
        // tozalangan holatni serverga qaytarib yozamiz — shu bilan ma'lumot
        // asta-sekin o'z-o'zini tuzatib boradi.
        const seenIds = new Set();
        const newOrders = [];
        newOrdersRaw.forEach(o => {
          if (seenIds.has(o.id)) { hadDuplicates = true; return; }
          seenIds.add(o.id);

          // MUHIM: bu yerda FAQAT bir xil "pid" (identifikator) borligini
          // tekshiramiz — aynan shu holat haqiqiy texnik xato (masalan tarmoq
          // xatosi tufayli) hisoblanadi. Mazmuni bir xil (bosqich/soni/rang
          // bir xil) lekin PID'i boshqa bo'laklar ATAYLAB tozalanmaydi,
          // chunki ular chindan ham ALOHIDA-ALOHIDA (turli vaqtda yopilgan)
          // haqiqiy partiyalar bo'lishi mumkin — bunday holatlarni "xato" deb
          // hisoblab o'chirish, aslida to'g'ri ma'lumotni yo'qotib qo'yardi.
          if (Array.isArray(o.partiyalar)) {
            const seenPid = new Set();
            const dedupedPartiyalar = [];
            o.partiyalar.forEach(p => {
              if (p.pid && seenPid.has(p.pid)) { hadDuplicates = true; return; }
              if (p.pid) seenPid.add(p.pid);
              dedupedPartiyalar.push(p);
            });
            o.partiyalar = dedupedPartiyalar;
          }

          newOrders.push(o);
        });

        state.orders = newOrders;
        saveLocalOrders();
        lastRawOrders = data.orders;
      }

      if (tarixChanged) {
        state.tarix = data.tarix ? JSON.parse(data.tarix) : [];
        saveLocalTarix();
        lastRawTarix = data.tarix;
      }

      if (omborChanged) {
        const newOmbor = data.ombor ? JSON.parse(data.ombor) : { zaxira: {}, chiqimlar: [] };
        if (!newOmbor.chiqimlar) newOmbor.chiqimlar = [];
        if (!newOmbor.zaxira) newOmbor.zaxira = {};
        state.ombor = newOmbor;
        saveLocalOmbor();
        lastRawOmbor = data.ombor;
      }

      if (archiveChanged) {
        state.archive = data.archive ? JSON.parse(data.archive) : [];
        storage.set('archive', JSON.stringify(state.archive));
        lastRawArchive = data.archive;
      }

      if (hadDuplicates) {
        pushOrdersQueued(); // tozalangan ro'yxatni serverga qaytarib yozish
      }

      // Faqat admin kirganda, kuniga bir marta — 2 oydan ortiq to'liq
      // tugagan konverlarni avtomatik arxivga o'tkazib turadi.
      if (state.user && state.user.bolim === 'admin') {
        maybeRunAutoArchive();
      }

      const activeTag = document.activeElement && document.activeElement.tagName;
      const isTyping = activeTag === 'INPUT' || activeTag === 'SELECT' || activeTag === 'TEXTAREA';
      const safeToRender = force || (state.user && state.tab !== 'yangi' && !isTyping);

      if (safeToRender) {
        render();
      }
      return;
    } else {
      isOnline = false;
    }
  } catch (e) {
    isOnline = false;
    console.error('Sheets bilan sinxronlashda xato:', e);
  }
  if (force) render();
}

async function pushToSheets(key, valueObj) {
  pendingPushes++;
  if (typeof render === 'function') render(); // saqlanmoqda... dumaloqini darhol ko'rsatish

  let success = false;
  let attempt = 1;
  const MAX_ATTEMPTS = 4;

  while (attempt <= MAX_ATTEMPTS && !success) {
    try {
      const res = await fetch(SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'set', key, value: JSON.stringify(valueObj) })
      });
      const data = await res.json();
      if (data && data.ok) {
        success = true;
        isOnline = true;
      } else {
        console.error('Server saqlashni rad etdi:', data && data.error);
        isOnline = false;
      }
    } catch (e) {
      isOnline = false;
      console.error('Sheetsga yozishda xato:', e);
    }

    if (!success && attempt < MAX_ATTEMPTS) {
      // MUHIM: server band bo'lgani yoki tarmoq xatosi tufayli yozib bo'lmasa,
      // jim-jit "saqlandi" deb hisoblab qo'ymasdan, biroz kutib QAYTA URINAMIZ —
      // shu butun jarayon davomida "Saqlanmoqda..." dumalog'i uzluksiz ko'rinadi.
      await new Promise(r => setTimeout(r, 1200 * attempt));
    }
    attempt++;
  }

  pendingPushes--;
  if (success) {
    lastPushDoneAt = Date.now();
  } else {
    alert('⚠️ Diqqat: ma\'lumot serverga saqlanmadi (internet yoki server bilan bog\'lanishda muammo). Iltimos, internetni tekshirib, amalni qayta bajaring.');
  }
  if (typeof render === 'function') render(); // yakunda dumaloqini yashirish
}

// MUHIM: agar foydalanuvchi tez-tez amal bajarsa, bir nechta "yozish" so'rovi
// deyarli bir vaqtda yuborilib qolishi mumkin edi. Tarmoqda ular NOTO'G'RI
// TARTIBDA yetib borsa (kechroq boshlangani tezroq tugasa), eski ma'lumot
// yangisining ustidan yozib, amal "yo'qolib qolgandek" ko'rinar edi.
// Shuning uchun endi har bir kalit (orders/tarix/ombor) uchun BITTA VAQTDA
// FAQAT BITTA so'rov yuboriladi; shu payt yana o'zgarish bo'lsa, navbatga
// qo'yiladi va oldingisi tugagach, ENG SO'NGGI holat yana yuboriladi.
function makeQueuedPusher(key, getValue) {
  let inFlight = false;
  let queued = false;
  async function attemptOnce() {
    const res = await fetch(SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'set', key, value: JSON.stringify(getValue()) })
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const result = await res.json();
    if (!result || result.ok !== true) {
      throw new Error((result && result.error) || 'Server "ok:true" qaytarmadi');
    }
  }
  async function run() {
    if (inFlight) { queued = true; return; }
    inFlight = true;
    pendingPushes++; render();

    let success = false;
    let lastErr = null;
    // Jami 3 marta urinib ko'radi (1 asosiy + 2 qayta urinish), har safar
    // orasida qisqa kutish bilan — server band (lock) bo'lganda ham
    // ma'lumot yo'qolib qolmasligi uchun.
    for (let attempt = 0; attempt < 3 && !success; attempt++) {
      try {
        if (attempt > 0) await new Promise(r => setTimeout(r, 700 * attempt));
        await attemptOnce();
        success = true;
      } catch (e) {
        lastErr = e;
      }
    }

    if (success) {
      isOnline = true;
      state.saveFailedBanner = false;
    } else {
      isOnline = false;
      console.error('Sheetsga yozishda xato (3 urinishdan keyin):', lastErr);
      // MUHIM: bu yerda jim qolmaymiz — foydalanuvchi darhol ko'radigan
      // doimiy ogohlantirish chiqaramiz, chunki aks holda o'zgarish
      // serverga yozilmay, keyin "qaytadan paydo bo'lish" holatiga olib
      // kelishi mumkin edi.
      state.saveFailedBanner = true;
    }

    pendingPushes--; lastPushDoneAt = Date.now();
    inFlight = false;
    render();
    if (queued) { queued = false; run(); }
  }
  return run;
}

// 2 oydan (60 kundan) ortiq TO'LIQ tugagan (barcha bo'laklari omborga
// kirim bo'lgan) konverlarni "orders" dan "archive" ga ko'chiradi.
// MUHIM: bu ombor zaxirasiga (state.ombor.zaxira) hech qanday tegmaydi —
// faqat konver yozuvining o'zi ko'chiriladi, zaxira o'zgarmasdan qoladi.
// Arxivlash mezoni: 2 oydan (60 kundan) ortiq TO'LIQ tugagan (barcha
// bo'laklari omborga kirim bo'lgan) konverlar. Bu funksiya hech narsani
// o'zgartirmaydi — faqat kimlar arxivga tushishini hisoblab beradi.
function getArchiveCandidates() {
  const cutoff = Date.now() - (60 * 24 * 60 * 60 * 1000);
  const toArchive = [];
  const remaining = [];

  state.orders.forEach(o => {
    if (o.holat === 'tayyor') {
      let latestFinish = 0;
      (o.partiyalar || []).forEach(p => {
        if (p.tugashVaqti) {
          const t = new Date(p.tugashVaqti).getTime();
          if (t > latestFinish) latestFinish = t;
        }
      });
      if (latestFinish > 0 && latestFinish < cutoff) {
        toArchive.push(o);
        return;
      }
    }
    remaining.push(o);
  });

  return { toArchive, remaining };
}

function runAutoArchive() {
  const { toArchive, remaining } = getArchiveCandidates();
  if (toArchive.length === 0) return;

  state.archive = (state.archive || []).concat(toArchive);
  state.orders = remaining;
  saveOrders();
  saveArchive();
  log('admin', 'avtomatik arxivlandi', '-', '-', toArchive.length, `${toArchive.length} ta konver 2 oydan ortiq tugagani uchun arxivga o'tkazildi`);
  render();
}

// Tarixga faqat bitta yangi yozuvni qo'shish (butun ro'yxatni qayta yozmaslik uchun)
async function appendTarixToServer(entry) {
  // MUHIM: tarix (harakatlar tarixi) — ikkinchi darajali (fon) yozuv, shuning
  // uchun asosiy "Saqlanmoqda..." ko'rsatkichini bloklamaydi. Faqat konver/
  // ombor ma'lumotlari (pendingPushes) tugaguncha kutish yetarli — foydalanuvchi
  // buni ikki marta kutib o'tirmasin.
  pendingTarixPushes++;
  let success = false, lastErr = null;
  for (let attempt = 0; attempt < 3 && !success; attempt++) {
    try {
      if (attempt > 0) await new Promise(r => setTimeout(r, 700 * attempt));
      const res = await fetch(SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'appendTarix', entry })
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const result = await res.json();
      if (!result || result.ok !== true) throw new Error((result && result.error) || 'Server "ok:true" qaytarmadi');
      success = true;
    } catch (e) {
      lastErr = e;
    }
  }
  if (success) {
    isOnline = true;
  } else {
    isOnline = false;
    console.error('Tarixga yozishda xato (3 urinishdan keyin):', lastErr);
    state.saveFailedBanner = true;
    render();
  }
  pendingTarixPushes--;
  lastPushDoneAt = Date.now();
}

function nextStage(cur) { 
  const idx = STAGE_SEQ.indexOf(cur); 
  return STAGE_SEQ[idx + 1]; 
}

function findOrder(id) { return state.orders.find(o => o.id === id); }
function recomputeHolat(order) { order.holat = order.partiyalar.every(p => p.holat === 'tugadi') ? 'tayyor' : 'jarayonda'; }
function esc(s) { return (s + '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

function formatDate(isoStr) {
  if (!isoStr) return '-';
  const d = new Date(isoStr);
  return `${d.toLocaleDateString()} ${d.toLocaleTimeString().slice(0,5)}`;
}

function formatTimeOnly(isoStr) {
  if (!isoStr) return '-';
  const d = new Date(isoStr);
  return `${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')} (${d.getDate()}/${d.getMonth()+1})`;
}

function calcDurationMinutes(startIso, endIso) {
  if (!startIso || !endIso) return 0;
  const diff = new Date(endIso) - new Date(startIso);
  return Math.max(0, Math.round(diff / (1000 * 60)));
}

async function createOrder(konver, model, soni, narx, oldindanRang) {
  konver = konver.trim();
  if (!konver || !model || !soni || soni <= 0) { alert(L().toliqTuldiring); return false; }

  // MUHIM: konver mavjudligini tekshirishdan oldin, avval serverdagi ENG SO'NGGI
  // ma'lumotni olib kelamiz. Aks holda, agar local xotira hali eskirgan/bo'sh bo'lsa
  // (masalan ilova endigina qayta yuklangan bo'lsa), bir xil konver bir necha marta
  // yaratilib, bir-birining ustiga tushib qolishi mumkin edi.
  await syncFromSheets(true);

  if (findOrder(konver)) { alert(L().konverMavjud); return false; }
  
  const now = new Date().toISOString();
  const BoshlangichBosqich = getModelStartStage(model);
  const narxBirlik = parseFloat(narx) || 0;
  const rangOldindan = (oldindanRang || '').trim() || null;

  state.orders.push({
    id: konver, model, jamiSoni: soni, sana: now, holat: 'jarayonda',
    narxBirlik: narxBirlik,
    partiyalar: [{ 
      pid: konver + '-' + Date.now(), 
      soni, 
      tugatilganSoni: 0, 
      bosqich: BoshlangichBosqich, 
      susal: false, 
      holat: 'kutilmoqda', 
      rang: rangOldindan, 
      qabulVaqti: null, 
      tugashVaqti: null 
    }]
  });
  
  saveOrders();
  log('admin', 'yaratdi', konver, model, soni, `Boshlang'ich: ${BoshlangichBosqich}${rangOldindan ? `, Rang oldindan: ${rangOldindan}` : ''}`);
  return true;
}

function deleteOrder(konverId) {
  if (!confirm(L().ochirishTasdiq)) return;

  const o = findOrder(konverId);
  if (o) {
    o.partiyalar.forEach(p => {
      if (p.bosqich === 'ombor' && p.holat === 'tugadi') {
        const key = p.rang ? `${o.model}-${p.rang}` : o.model;
        if (state.ombor.zaxira[key]) {
          let item = state.ombor.zaxira[key];
          let curQty = typeof item === 'object' ? item.soni : parseInt(item);
          curQty -= p.soni;
          if (curQty <= 0) {
            delete state.ombor.zaxira[key];
          } else if (typeof item === 'object') {
            item.soni = curQty;
          } else {
            state.ombor.zaxira[key] = curQty;
          }
        }
      }
    });

    if (state.ombor.chiqimlar && state.ombor.chiqimlar.length > 0) {
      // MUHIM: faqat aynan shu konver raqamiga tegishli chiqim yozuvlari o'chiriladi
      // (avval model nomi bo'yicha taxminiy izlangani uchun bir xil fasondagi
      // boshqa buyurtmalarning chiqimlari ham xato o'chib ketishi mumkin edi)
      state.ombor.chiqimlar = state.ombor.chiqimlar.filter(c => c.konver !== konverId);
    }
    saveOmbor();
  }

  state.orders = state.orders.filter(item => item.id !== konverId);
  state.tarix = state.tarix.filter(item => item.konver !== konverId);
  
  saveOrders();
  saveTarix();

  log('admin', 'o\'chirdi', konverId, o ? o.model : '', 0, 'Buyurtma va ombor tarixi tozalandi');
  render();
}

function editOrder(oldKonver, newKonver, newModel, newSoni, newNarx, newRang) {
  newKonver = newKonver.trim();
  if (!newKonver || !newModel || !newSoni || newSoni <= 0) { alert(L().toliqTuldiring); return; }
  
  if (oldKonver !== newKonver && findOrder(newKonver)) {
    alert(L().konverMavjud); return;
  }

  const o = findOrder(oldKonver);
  if (!o) return;

  const oldJamiSoni = parseInt(o.jamiSoni) || 0;
  const oldModel = o.model;

  o.id = newKonver;
  o.model = newModel;
  o.jamiSoni = newSoni;
  o.narxBirlik = parseFloat(newNarx) || 0;

  o.partiyalar.forEach(p => {
    p.pid = p.pid.replace(oldKonver, newKonver);
  });

  // Rangni tahrirlash: konverdagi mavjud bo'laklarning rangini bir xil
  // yangi rangga o'tkazamiz. Bo'sh qoldirilsa rang olib tashlanadi.
  const rangValue = (newRang || '').trim() || null;
  o.partiyalar.forEach(p => { p.rang = rangValue; });

  // Son oshirilsa, YANGI KONVER KARTASI OCHILMAYDI. Qo'shilayotgan stullar
  // aynan shu konverning boshlang'ich bo'limidagi mavjud partiyaga qo'shiladi.
  // Masalan Barocco 24 -> 36 bo'lsa, zborkadagi 12 -> 24 bo'ladi;
  // shkurkadagi 12 esa o'z joyida qoladi. Owen uchun esa boshlang'ich bo'lim
  // shkurka bo'lgani sababli qo'shilgan son shkurkadagi mavjud partiyaga qo'shiladi.
  const sonFarqi = newSoni - oldJamiSoni;
  const startStage = getModelStartStage(newModel);

  if (sonFarqi > 0) {
    let targetPartiya = o.partiyalar.find(p =>
      p.bosqich === startStage && p.holat !== 'tugadi'
    );

    if (targetPartiya) {
      targetPartiya.soni = (parseInt(targetPartiya.soni) || 0) + sonFarqi;
      targetPartiya.tugatilganSoni = parseInt(targetPartiya.tugatilganSoni) || 0;
      targetPartiya.rang = rangValue;
      log('admin', 'konver soni oshirildi', newKonver, newModel, sonFarqi,
        `Jami: ${oldJamiSoni} -> ${newSoni}; mavjud ${startStage} partiyasiga ${sonFarqi} ta qo'shildi`);
    } else {
      // Boshlang'ich bo'limdagi eski partiya allaqachon tugagan bo'lsa,
      // yangi ish oqimini boshlash uchun partiya yaratishga to'g'ri keladi.
      o.partiyalar.push({
        pid: newKonver + '-' + Date.now() + '-add',
        soni: sonFarqi,
        tugatilganSoni: 0,
        bosqich: startStage,
        susal: false,
        holat: 'kutilmoqda',
        rang: rangValue,
        qabulVaqti: null,
        tugashVaqti: null,
        parentPid: null,
        addedByEdit: true
      });
      log('admin', 'konver soni oshirildi', newKonver, newModel, sonFarqi,
        `Jami: ${oldJamiSoni} -> ${newSoni}; ${startStage} bosqichida yangi oqim boshlandi`);
    }
  } else if (sonFarqi < 0) {
    // Son kamaytirilganda faqat boshlang'ich bo'limda hali bajarilmagan
    // stullardan kamaytiramiz; allaqachon keyingi bo'limga o'tgan/yopilgan
    // stullarni avtomatik o'chirmaymiz.
    let removeQty = Math.abs(sonFarqi);
    const candidates = o.partiyalar.filter(p => p.bosqich === startStage && p.holat !== 'tugadi').slice().reverse();
    for (const p of candidates) {
      if (removeQty <= 0) break;
      const take = Math.min(removeQty, parseInt(p.soni) || 0);
      p.soni -= take;
      removeQty -= take;
      if (p.soni <= 0) o.partiyalar = o.partiyalar.filter(x => x.pid !== p.pid);
    }
    if (removeQty > 0) {
      alert(`Jami son kamaytirildi, lekin ${removeQty} ta stul allaqachon keyingi bo'limlarga o'tgan yoki yopilgan. Ular avtomatik o'chirilmadi.`);
    }
  }

  if (state.ombor.chiqimlar) {
    state.ombor.chiqimlar.forEach(c => {
      if (c.konver === oldKonver) c.konver = newKonver;
    });
    saveOmbor();
  }

  saveOrders();
  log('admin', 'tahrirladi', newKonver, newModel, newSoni, `Eski konver: ${oldKonver}`);
  state.editModal = null;
  render();
}

// MUHIM: bir amal (qabul qilish/tugatish/bo'lish) bajarilayotgan paytda,
// ikkinchi marta bosilib ketsa ham, u e'tiborsiz qoldiriladi — shu orqali
// bir xil konver/partiya bir necha marta yaratilib qolishining oldi olinadi.
let uiActionLock = false;
function withActionLock(fn) {
  return function (...args) {
    if (uiActionLock) return;
    uiActionLock = true;
    try {
      fn.apply(this, args);
    } finally {
      setTimeout(() => { uiActionLock = false; }, 400);
    }
  };
}

  p.holat = 'jarayonda';
  p.qabulVaqti = new Date().toISOString();
  saveOrders();
  log(p.bosqich, 'qabul qildi', konverId, o.model, p.soni, '');
  render();
}
acceptPartiya = withActionLock(acceptPartiya);

function openDoneModal(konverId, pid) {
  const o = findOrder(konverId); if (!o) return;
  const p = o.partiyalar.find(x => x.pid === pid); if (!p) return;
  state.doneModal = { konverId, pid, max: p.soni };

function confirmDone(rawVal) {
  const { konverId, pid, max } = state.doneModal;
  const o = findOrder(konverId);
  const p = o.partiyalar.find(x => x.pid === pid);
  let qty = parseInt(rawVal);
  if (isNaN(qty) || qty <= 0) { state.doneModal = null; render(); return; }
  qty = Math.min(max, qty);

  state.doneModal = null;
  const now = new Date().toISOString();
  const curBolim = p.bosqich;

  if (p.bosqich === 'lak') {
    if (p.rang) {
      // Rang konver yaratilayotganda oldindan tanlangan — Lak karkasdan
      // qayta so'ralmaydi, to'g'ridan-to'g'ri susal so'roviga o'tadi.
      state.splitModal = { konverId, doneQty: qty, colorName: p.rang, parentPid: pid, isFull: (qty === max) };
      render();
      return;
    }
    state.colorModal = { konverId, doneQty: qty, parentPid: pid, isFull: (qty === max) };
    render();
    return;
  }

  p.soni = qty;
  p.tugashVaqti = now;
  p.holat = 'tugadi';

  log(curBolim, 'tugatdi', konverId, o.model, qty, '');

  if (p.bosqich === 'ombor') {
    const key = p.rang ? `${o.model}-${p.rang}` : o.model;
    const konverNarxi = parseFloat(o.narxBirlik) || 0;
    if (typeof state.ombor.zaxira[key] === 'object') {
      state.ombor.zaxira[key].soni += qty;
      if (konverNarxi > 0) state.ombor.zaxira[key].narx = konverNarxi;
    } else {
      const oldVal = parseInt(state.ombor.zaxira[key]) || 0;
      state.ombor.zaxira[key] = { soni: oldVal + qty, narx: konverNarxi };
    }
    saveOmbor();
  } else {
    const nxt = nextStage(p.bosqich);
    o.partiyalar.push({
      pid: konverId + '-' + Date.now(),
      soni: qty,
      tugatilganSoni: 0,
      bosqich: nxt,
      susal: p.susal,
      holat: 'kutilmoqda',
      rang: p.rang || null,
      qabulVaqti: null,
      tugashVaqti: null,
      parentPid: p.pid
    });
  }

  if (qty < max) {
    o.partiyalar.push({
      pid: konverId + '-' + (Date.now() + 1),
      soni: max - qty,
      tugatilganSoni: 0,
      bosqich: p.bosqich,
      susal: p.susal,
      holat: 'jarayonda',
      rang: p.rang || null,
      qabulVaqti: p.qabulVaqti,
      tugashVaqti: null
    });
  }

  recomputeHolat(o);
  saveOrders();
  render();
}
confirmDone = withActionLock(confirmDone);

function confirmColor(colorName) {
  const { konverId, doneQty, parentPid, isFull } = state.colorModal;
  state.colorModal = null;
  state.splitModal = { konverId, doneQty, colorName, parentPid, isFull };
  render();
}

function confirmSplit(susalRaw) {
  const { konverId, doneQty, colorName, parentPid, isFull } = state.splitModal;
  const o = findOrder(konverId);
  if (!o) { state.splitModal = null; render(); return; }

  // MUHIM: pRefni oldindan saqlab qo'yish o'rniga, HAR DOIM shu paytdagi
  // ENG YANGI (joriy) partiyalar ro'yxatidan qidirib topamiz. Chunki oyna
  // ochiq turgan payt (son -> rang -> susal so'ralguncha) fon-sinxronlash
  // ishga tushib, butun ro'yxatni yangilab qo'yishi mumkin edi — shunda
  // eski (saqlab qo'yilgan) obyekt havolasi endi joriy ro'yxatda
  // MAVJUD BO'LMAY QOLAR, va unga qilingan o'zgarish hech qayerga
  // yozilmay, natijada "lak"da ham eski yozuv o'zgarishsiz qolib ketardi.
  const pRef = o.partiyalar.find(x => x.pid === parentPid);
  if (!pRef) {
    alert('Bu bo\'lak allaqachon yangilangan yoki topilmadi. Iltimos, ro\'yxatni yangilab, qaytadan urinib ko\'ring.');
    state.splitModal = null;
    syncFromSheets(true);
    return;
  }

  let susalSoni = parseInt(susalRaw) || 0;
  susalSoni = Math.max(0, Math.min(doneQty, susalSoni));
  const oddiySoni = doneQty - susalSoni;
  const now = new Date().toISOString();

  // MUHIM: pRef.soni hozircha hali o'zgartirilmagan bo'lgani uchun, bu yerda
  // aynan shu partiyaning ASL (to'liq) sonini olib qolamiz — pastda qolgan
  // (hali tugallanmagan) qismni yo'qotmaslik uchun kerak bo'ladi.
  const originalMax = pRef.soni;
  const qabulVaqtiOldin = pRef.qabulVaqti;
  const leftover = originalMax - doneQty;

  pRef.soni = doneQty;
  pRef.tugashVaqti = now;
  pRef.holat = 'tugadi';
  pRef.rang = colorName;

  if (susalSoni > 0) {
    o.partiyalar.push({
      pid: konverId + '-' + Date.now() + '-s', 
      soni: susalSoni, 
      tugatilganSoni: 0,
      bosqich: 'susal', 
      susal: true, 
      holat: 'kutilmoqda', 
      rang: colorName, 
      qabulVaqti: null, 
      tugashVaqti: null,
      parentPid: pRef.pid
    });
  }

  if (oddiySoni > 0) {
    o.partiyalar.push({
      pid: konverId + '-' + Date.now() + '-q', 
      soni: oddiySoni, 
      tugatilganSoni: 0,
      bosqich: 'qoplash', 
      susal: false, 
      holat: 'kutilmoqda', 
      rang: colorName, 
      qabulVaqti: null, 
      tugashVaqti: null,
      parentPid: pRef.pid
    });
  }

  // Agar 12 tadan faqat 6 tasi yopilgan bo'lsa (masalan), qolgan 6 tasi
  // yo'qolib ketmasligi uchun — u hali "lak karkas"da, jarayonda holida qoladi.
  if (leftover > 0) {
    o.partiyalar.push({
      pid: konverId + '-' + Date.now() + '-qolgan',
      soni: leftover,
      tugatilganSoni: 0,
      bosqich: 'lak',
      susal: false,
      holat: 'jarayonda',
      rang: null,
      qabulVaqti: qabulVaqtiOldin,
      tugashVaqti: null
    });
  }

  log('lak', 'tugatdi (rang/susal)', konverId, o.model, doneQty, `Rang: ${colorName}, Susal: ${susalSoni}`);
  recomputeHolat(o);
  saveOrders();
  state.splitModal = null;
  render();
}
confirmSplit = withActionLock(confirmSplit);
confirmColor = withActionLock(confirmColor);
adminRevertPartiya = withActionLock(adminRevertPartiya);

function skipSusal() { confirmSplit(0); }

// --- OMBORGA REAL TMO DAN KIRIM QILISH ---
function addManualStock(model, rang, soni, narx) {
  soni = parseInt(soni) || 0; narx = parseFloat(narx) || 0;
  if (!model || soni <= 0) { alert("Model va sonini to'g'ri kiriting!"); return; }

  const key = rang ? `${model}-${rang}` : model;
  
  if (state.ombor.zaxira[key]) {
    if (typeof state.ombor.zaxira[key] === 'object') {
      state.ombor.zaxira[key].soni += soni;
      if (narx > 0) state.ombor.zaxira[key].narx = narx;
    } else {
      const oldVal = parseInt(state.ombor.zaxira[key]) || 0;
      state.ombor.zaxira[key] = { soni: oldVal + soni, narx: narx };
    }
  } else {
    state.ombor.zaxira[key] = { soni: soni, narx: narx };
  }

  saveOmbor();
  log('ombor', 'kirim', 'SKLAD', model, soni, `Rang: ${rang}, Narx: $${narx}`);
  state.manualKirimModal = false;
  render();
}

function updateStockDetails(key, newSoni, newNarx) {

  } else {
    state.ombor.zaxira[key] = { soni: newSoni, narx: newNarx };

}

function dispatchStock(key, selectedKonver, soni, izoh) {
  soni = parseInt(soni) || 0; if (soni <= 0) return;
  
  let currentObj = state.ombor.zaxira[key];
  let currentQty = typeof currentObj === 'object' ? currentObj.soni : (parseInt(currentObj) || 0);
  let narxBirlik = typeof currentObj === 'object' ? (parseFloat(currentObj.narx) || 0) : 0;

  if (soni > currentQty) { alert('Omborda yetarli zaxira yo\'q!'); return; }
  
  if (typeof currentObj === 'object') {
    currentObj.soni -= soni;
    if (currentObj.soni <= 0) delete state.ombor.zaxira[key];
  } else {
    state.ombor.zaxira[key] = currentQty - soni;
    if (state.ombor.zaxira[key] <= 0) delete state.ombor.zaxira[key];
  }

  if (!state.ombor.chiqimlar) state.ombor.chiqimlar = [];
  state.ombor.chiqimlar.push({
    id: 'ch-' + Date.now(),
    vaqt: new Date().toISOString(),
    konver: selectedKonver || '-',
    modelKey: key,
    soni,
    izoh,
    narxBirlik,
    jamiSumma: narxBirlik * soni
  });

  saveOmbor(); log('ombor', 'chiqim qildi', selectedKonver || '-', key, soni, izoh);
  state.dispatchModal = false; render();
}

// --- CHIQIMNI TAHRIRLASH VA O'CHIRISH FUNKSIYALARI ---
function deleteChiqim(chiqimIndex) {
  if (!confirm("Ushbu chiqimni o'chirmoqchimisiz? Chiqimdagi stullar ombor zaxirasiga qaytariladi.")) return;
  const list = state.ombor.chiqimlar || [];
  const c = list[chiqimIndex];
  if (!c) return;

  // Omborga qaytarish
  const key = c.modelKey;
  if (state.ombor.zaxira[key]) {
    if (typeof state.ombor.zaxira[key] === 'object') {
      state.ombor.zaxira[key].soni += c.soni;
    } else {
      state.ombor.zaxira[key] = (parseInt(state.ombor.zaxira[key]) || 0) + c.soni;
    }
  } else {
    state.ombor.zaxira[key] = { soni: c.soni, narx: 0 };
  }

  list.splice(chiqimIndex, 1);
  saveOmbor();
  log('ombor', 'chiqim o\'chirildi', c.konver || '-', key, c.soni, 'Chiqim o\'chirildi va omborga qaytarildi');
  render();
}

function openEditChiqimModal(idx) {
  const c = state.ombor.chiqimlar[idx];
  if (!c) return;
  state.editChiqimModal = { index: idx, modelKey: c.modelKey, soni: c.soni, izoh: c.izoh || '' };
  render();
}

function saveEditChiqim(idx, newSoni, newIzoh) {
  newSoni = parseInt(newSoni) || 0;
  if (newSoni <= 0) { alert("Soni 1 dan kichik bo'lishi mumkin emas!"); return; }

  const c = state.ombor.chiqimlar[idx];
  if (!c) return;

  const diff = newSoni - c.soni; // Masalan: oldin 10 edi, endi 12 bo'lsa (+2 ta ko'p chiqim bo'ldi => zaxiradan 2 ta ayiramiz)
  const key = c.modelKey;

  let currentObj = state.ombor.zaxira[key];
  let currentQty = typeof currentObj === 'object' ? currentObj.soni : (parseInt(currentObj) || 0);

  if (diff > 0 && diff > currentQty) {
    alert("Omborda bunday miqdorda ortiqcha zaxira yo'q!");
    return;
  }

  // Zaxirani yangilash
  if (typeof currentObj === 'object') {
    currentObj.soni -= diff;
    if (currentObj.soni <= 0) delete state.ombor.zaxira[key];
  } else {
    state.ombor.zaxira[key] = currentQty - diff;
    if (state.ombor.zaxira[key] <= 0) delete state.ombor.zaxira[key];
  }

  c.soni = newSoni;
  c.izoh = newIzoh;

  saveOmbor();
  log('ombor', 'chiqim tahrir', c.konver || '-', key, newSoni, `Yangi izoh: ${newIzoh}`);
  state.editChiqimModal = null;
  render();
}

// EXCEL YUKLASH FUNKSIYASI (SheetJS orqali)
function exportToExcel() {
  const isAdmin = state.user.bolim === 'admin';
  const targetDept = isAdmin ? state.selectedDeptFilter : state.user.bolim;

  const data = [];
  const fromDate = state.statFrom ? new Date(state.statFrom + 'T00:00:00') : null;
  const toDate = state.statTo ? new Date(state.statTo + 'T23:59:59') : null;

  [...state.orders, ...(state.archive || [])].forEach(o => {
    o.partiyalar.forEach(p => {
      if (p.bosqich === targetDept) {
        if (p.tugashVaqti) {
          const tDate = new Date(p.tugashVaqti);
          if (fromDate && tDate < fromDate) return;
          if (toDate && tDate > toDate) return;
        }

        data.push({
          "Konver ID": o.id,
          "Mahsulot Nomi": o.model,
          "Soni (dona)": p.soni,
          "Bosqich": getStageLabel(p.bosqich),
          "Rang": p.rang || '-',
          "Susal": p.susal ? 'Ha' : 'Yo\'q',
          "Holati": p.holat,
          "Qabul vaqti": formatDate(p.qabulVaqti),
          "Tugash vaqti": formatDate(p.tugashVaqti)
        });
      }
    });
  });

  if (data.length === 0) {
    alert("Yuklash uchun ma'lumot topilmadi!");
    return;
  }

  const ws = XLSX.utils.json_to_sheet(data);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Hisobot");
  XLSX.writeFile(wb, `Hisobot_${targetDept}_${new Date().toISOString().slice(0,10)}.xlsx`);
}

// Bu — "Qaytarish"dan BUTUNLAY MUSTAQIL funksiya: faqat shu bitta bo'lakni
// (partiyani) ro'yxatdan olib tashlaydi, hech qanday boshqa bosqichga
// ko'chirmaydi. Masalan takrorlanib qolgan ortiqcha yozuvni tozalash uchun.
function adminDeletePartiya(konverId, pid) {
  const o = findOrder(konverId); if (!o) return;
  const p = o.partiyalar.find(x => x.pid === pid); if (!p) return;

  if (!confirm(`"${konverId}" (${o.model}, ${p.soni} dona, ${getStageLabel(p.bosqich)}) — bu bo'lak BUTUNLAY o'chirilsinmi? Bu amalni orqaga qaytarib bo'lmaydi.`)) return;

  o.partiyalar = o.partiyalar.filter(x => x.pid !== pid);
  log('admin', 'bo\'lakni o\'chirdi', konverId, o.model, p.soni, `${getStageLabel(p.bosqich)}dan o'chirildi`);
  recomputeHolat(o);
  saveOrders();
  render();
}
adminDeletePartiya = withActionLock(adminDeletePartiya);

function adminRevertPartiya(konverId, pid) {
  const o = findOrder(konverId); if (!o) return;
  const p = o.partiyalar.find(x => x.pid === pid); if (!p) return;

  const oldBosqich = p.bosqich;
  const idx = STAGE_SEQ.indexOf(oldBosqich);

  if (idx <= 0) {
    alert(`Bu bo'lak allaqachon birinchi bosqichda (${getStageLabel(oldBosqich)}) — orqaga qaytarib bo'lmaydi.`);
    return;
  }
  if (oldBosqich === 'ombor' && p.holat === 'tugadi') {
    alert('Bu bo\'lak allaqachon tayyor mahsulot omboriga kirim qilingan. Uni qaytarish uchun avval ombor zaxirasidan ayirish kerak — bu funksiya hozircha qo\'llab-quvvatlanmaydi.');
    return;
  }

  // MUHIM: konver hozir QAYSI bo'limda turgan bo'lsa, shundan BIR BOSQICH
  // ORQAGA qaytariladi — bu tugmani qaysi bo'lim ekranidan (yoki admin
  // tomonidan) ochishidan qat'iy nazar, natija bir xil bo'ladi.
  const targetBosqich = STAGE_SEQ[idx - 1];

  if (!confirm(`"${konverId}" (${o.model}, ${p.soni} dona) ${getStageLabel(oldBosqich)}dan ${getStageLabel(targetBosqich)}ga qaytarilsinmi?`)) return;

  p.bosqich = targetBosqich;
  p.holat = 'kutilmoqda'; // "Qabul qildim" bosilishini kutadigan holatga qaytadi
  p.qabulVaqti = null;
  p.tugashVaqti = null;

  // MUHIM: bu bo'lak avval qaysi "tugadi" (tarixiy) yozuvdan hosil bo'lgan
  // bo'lsa, o'sha yozuvni endi o'chiramiz — aks holda statistikada
  // "tugallangan" soni ikki (yoki undan ko'p) marta hisoblanib qolar edi,
  // chunki eski yozuv ortda, o'chirilmagan holda qolib ketardi.
  if (p.parentPid) {
    const parentIdx = o.partiyalar.findIndex(x => x.pid === p.parentPid && x.holat === 'tugadi');
    if (parentIdx !== -1) {
      o.partiyalar.splice(parentIdx, 1);
    }
  }
  log(targetBosqich, 'admin tomonidan qaytarildi', konverId, o.model, p.soni, `${getStageLabel(oldBosqich)}dan qaytarildi`);
  recomputeHolat(o);
  saveOrders();
  state.fixModal = null;
  render();
}

}

function renderOmborZaxira() {
  const l = L();
  let totalStockCount = 0;
  let totalStockMoney = 0;
  const isOmborchi = state.user && state.user.bolim === 'ombor';
  const isAdminView = state.user && state.user.bolim === 'admin';
  const perModelMoney = {};
  const perModelCount = {};

  // Ishlab chiqarishda (zborka...qoplash, ombordan tashqari) hali yurgan
  // stullarning narxini hisoblash — faqat adminga ko'rsatiladi.
  // MUHIM: "Jarayondagi ishlar" ro'yxati bilan bir xil mezon ishlatiladi —
  // faqat p.holat !== 'tugadi' bo'lgan partiyalar hisobga olinadi (bosqichi
  // "ombor" bo'lmagan hollarda). Eski, allaqachon tugagan (tarixiy, holat:
  // 'tugadi') partiyalar hisobga OLINMAYDI — aks holda tarixiy yozuvlar ham
  // "hali jarayonda" deb hisoblanib, narx noto'g'ri ko'payib ketardi.
  let ichTotalMoney = 0;
  const perModelIch = {};
  const perModelIchSoni = {};
  state.orders.forEach(o => {
    const narx = parseFloat(o.narxBirlik) || 0;
    if (narx <= 0) return;
    let ichSoni = 0;
    (o.partiyalar || []).forEach(p => {
      if (p.bosqich !== 'ombor' && p.holat !== 'tugadi') ichSoni += (p.soni || 0);
    });
    if (ichSoni > 0) {
      const qiymat = ichSoni * narx;
      ichTotalMoney += qiymat;
      perModelIch[o.model] = (perModelIch[o.model] || 0) + qiymat;
      perModelIchSoni[o.model] = (perModelIchSoni[o.model] || 0) + ichSoni;
    }
  });

  let stockKeys = Object.keys(state.ombor.zaxira).filter(k => {
    const item = state.ombor.zaxira[k];
    const count = typeof item === 'object' ? item.soni : (parseInt(item) || 0);
    return count > 0;
  });

  // Filters calculation
  if (state.stockFilterModel !== 'all') {
    stockKeys = stockKeys.filter(k => (state.ombor.zaxira[k].model || k.split('-')[0]) === state.stockFilterModel);
  }
  if (state.stockFilterColor !== 'all') {
    stockKeys = stockKeys.filter(k => {
      const item = state.ombor.zaxira[k];
      const color = item.rang || item.rang_kodi || k.split('-').slice(1).join('-');
      return color === state.stockFilterColor;
    });
  }

  const stockCards = stockKeys.map(key => {
    const item = state.ombor.zaxira[key];
    const count = typeof item === 'object' ? item.soni : (parseInt(item) || 0);
    const price = typeof item === 'object' ? (parseFloat(item.narx) || 0) : 0;
    const total = count * price;

    totalStockCount += count;
    totalStockMoney += total;

    const model = item.model || key.split('-')[0]; const color = item.rang || item.rang_kodi || key.split('-').slice(1).join('-');
    perModelMoney[model] = (perModelMoney[model] || 0) + total;
    perModelCount[model] = (perModelCount[model] || 0) + count;

    // Omborchiga narx ko'rinmasin (shtrixlangan) — faqat admin parolini
    // kiritib "ochgandan" keyingina, yoki admin bo'lsa har doim ko'rinadi.
    const showPrice = isAdminView || state.pricesRevealed;
    const priceHtml = showPrice
      ? `Narxi: <b>$${price}</b>`
      : `Narxi: <span onclick="tryRevealPrices()" style="filter:blur(4px); cursor:pointer; user-select:none;">$${price}</span> <span onclick="tryRevealPrices()" style="cursor:pointer;">🔒</span>`;
    const totalHtml = showPrice
      ? `$${total.toLocaleString()}`
      : `<span onclick="tryRevealPrices()" style="filter:blur(5px); cursor:pointer; user-select:none;">$${total.toLocaleString()}</span>`;

    return `
    <div class="stock-price-card">
      <div>
        <div class="st-title">🪑 ${model} ${color ? colorBadge(color) : ''}</div>
        <div class="st-sub">Soni: <b>${count}</b> dona &middot; ${priceHtml}</div>
      </div>
      <div>
        <div class="st-total">${totalHtml}</div>
        <div class="st-unit">Jami qiymat</div>
        ${isOmborchi ? `<button class="edit-btn" style="margin-top:4px;padding:3px 8px;font-size:10px;" onclick="openEditStockModal('${key}')">✏️ Narx/Soni</button>` : ''}
      </div>
    </div>`;
  }).join('');

  return `
  ${renderBackButton()}
  
  <div class="total-summary" style="background:#D1FAE5;border-color:#10B981;margin-bottom:${state.showOmborSoniBreakdown ? '0' : '12px'};cursor:pointer;" onclick="state.showOmborSoniBreakdown=!state.showOmborSoniBreakdown;render();">
    <div>
      <span class="label" style="color:#065F46;">Jami stullar soni:</span>
      <div style="font-size:12px;color:#047857;">Ombordagi tayyor zaxira &middot; tarkibini ko'rish uchun bosing</div>
    </div>
    <span class="number" style="color:#065F46;">${totalStockCount} dona</span>
  </div>
  ${state.showOmborSoniBreakdown ? `
  <div class="card" style="margin-bottom:12px;">
    ${Object.keys(perModelCount).sort().map(m => `
      <div class="list-row" style="display:flex;justify-content:space-between;padding:6px 0;">
        <span>${m}</span>
        <span style="font-weight:700;color:#065F46;">${perModelCount[m]} dona</span>
      </div>`).join('') || `<div class="empty">Ma'lumot yo'q</div>`}
  </div>` : ''}

  ${isAdminView ? `
  <div class="total-summary" style="background:#EFF6FF;border-color:#2563EB;margin-bottom:${state.showOmborSummaBreakdown ? '0' : '16px'};cursor:pointer;" onclick="state.showOmborSummaBreakdown=!state.showOmborSummaBreakdown;render();">
    <div>
      <span class="label" style="color:#1E40AF;">💵 Ombor Jami Qiymati ($):</span>
      <div style="font-size:12px;color:#1D4ED8;">Barcha stullar summasi &middot; tarkibini ko'rish uchun bosing</div>
    </div>
    <span class="number" style="color:#1E40AF;">$${totalStockMoney.toLocaleString()}</span>
  </div>
  ${state.showOmborSummaBreakdown ? `
  <div class="card" style="margin-bottom:16px;">
    ${Object.keys(perModelMoney).sort().map(m => `
      <div class="list-row" style="display:flex;justify-content:space-between;padding:6px 0;">
        <span>${m} <span style="color:var(--ink-soft); font-weight:400;">(${perModelCount[m] || 0} dona)</span></span>
        <span style="font-weight:700;color:#1E40AF;">$${perModelMoney[m].toLocaleString()}</span>
      </div>`).join('') || `<div class="empty">Ma'lumot yo'q</div>`}
  </div>` : ''}

  <div class="total-summary" style="background:#FFF7ED;border-color:#EA580C;margin-bottom:${state.showIchSummaBreakdown ? '0' : '16px'};cursor:pointer;" onclick="state.showIchSummaBreakdown=!state.showIchSummaBreakdown;render();">
    <div>
      <span class="label" style="color:#9A3412;">🏭 I/CH dagi stullar narxi ($):</span>
      <div style="font-size:12px;color:#C2410C;">Zborka-Qoplash oralig'ida jarayondagi stullar &middot; tarkibini ko'rish uchun bosing</div>
    </div>
    <span class="number" style="color:#9A3412;">$${ichTotalMoney.toLocaleString()}</span>
  </div>
  ${state.showIchSummaBreakdown ? `
  <div class="card" style="margin-bottom:16px;">
    ${Object.keys(perModelIch).sort().map(m => `
      <div class="list-row" style="display:flex;justify-content:space-between;padding:6px 0;">
        <span>${m} <span style="color:var(--ink-soft); font-weight:400;">(${perModelIchSoni[m] || 0} dona)</span></span>
        <span style="font-weight:700;color:#9A3412;">$${perModelIch[m].toLocaleString()}</span>
      </div>`).join('') || `<div class="empty">Ma'lumot yo'q</div>`}
  </div>` : ''}
  ` : ''}

  ${isOmborchi ? `
  <div style="display:flex;gap:8px;margin-bottom:16px;">
    <button class="primary" onclick="state.manualKirimModal=true;render();">➕ Kirim (real TMO dan kirim qilish)</button>
    <button class="secondary" onclick="state.dispatchModal=true;render();">🚚 Chiqim Qilish</button>
  </div>` : ''}

  <!-- FILTRLAR -->
  <div class="filter-box">
    <div>
      <label class="field-label">Fason bo'yicha:</label>
      <select onchange="state.stockFilterModel=this.value;render();">
        <option value="all" ${state.stockFilterModel==='all'?'selected':''}>Barcha Fasonlar</option>
        ${MODELS.map(m => `<option value="${m}" ${state.stockFilterModel===m?'selected':''}>${m}</option>`).join('')}
      </select>
    </div>
    <div>
      <label class="field-label">Rang bo'yicha:</label>
      <select onchange="state.stockFilterColor=this.value;render();">
        <option value="all" ${state.stockFilterColor==='all'?'selected':''}>Barcha Ranglar</option>
        ${COLORS.map(c => `<option value="${c}" ${state.stockFilterColor===c?'selected':''}>${c}</option>`).join('')}
      </select>
    </div>
  </div>

  <h2 class="section-title" style="cursor:pointer; display:flex; justify-content:space-between; align-items:center;" onclick="state.stockListCollapsed=!state.stockListCollapsed;render();">
    <span>🏬 OMBORDAGI MAHSULOTLAR RO'YXATI (${stockKeys.length})</span>
    <span>${state.stockListCollapsed ? '▼' : '▲'}</span>
  </h2>
  ${state.stockListCollapsed ? '' : (stockCards ? stockCards : `<div class="empty">📦 Omborda stul topilmadi</div>`)}
  `;
}

function renderChiqimlar() {
  const l = L();
  let list = state.ombor.chiqimlar || [];
  const isOmborchi = state.user && state.user.bolim === 'ombor';
  const isAdminChiqim = state.user && state.user.bolim === 'admin';

  // Filters calculation
  if (state.chiqimFilterModel !== 'all') {
    list = list.filter(c => (c.model || c.modelKey.split('-')[0]) === state.chiqimFilterModel);
  }
  if (state.chiqimFilterColor !== 'all') {
    list = list.filter(c => (c.rang_kodi || c.modelKey.split('-').slice(1).join('-')) === state.chiqimFilterColor);
  }
  const chiqimFromDate = state.chiqimFrom ? new Date(state.chiqimFrom + 'T00:00:00') : null;
  const chiqimToDate = state.chiqimTo ? new Date(state.chiqimTo + 'T23:59:59') : null;
  if (chiqimFromDate || chiqimToDate) {
    list = list.filter(c => {
      const d = new Date(c.vaqt);
      if (chiqimFromDate && d < chiqimFromDate) return false;
      if (chiqimToDate && d > chiqimToDate) return false;
      return true;
    });
  }

  // Umumiy soni va narxi (faqat filtrlangan ro'yxat bo'yicha)
  let totalChiqimSoni = 0;
  let totalChiqimNarxi = 0;
  const perModelChiqimNarxi = {};
  const perModelChiqimSoni = {};
  list.forEach(c => {
    totalChiqimSoni += (c.soni || 0);
    const summa = c.jamiSumma || 0;
    totalChiqimNarxi += summa;
    const model = c.model || (c.modelKey || '').split('-')[0];
    perModelChiqimNarxi[model] = (perModelChiqimNarxi[model] || 0) + summa;
    perModelChiqimSoni[model] = (perModelChiqimSoni[model] || 0) + (c.soni || 0);
  });

  const rows = list.length === 0 ? `<div class="empty">📦 Chiqimlar topilmadi</div>` :
  list.slice().reverse().map((c, revIdx) => {
    const originalIdx = state.ombor.chiqimlar.findIndex(x => x.id === c.id);
    return `
    <div class="card">
      <div class="row-between">
        <div>
          <b>${esc(c.modelKey || ((c.model || '') + '-' + (c.rang_kodi || '')))}</b>
          <div style="font-size:11px;color:var(--primary);font-weight:700;">Konver: ${esc(c.konver || '-')}</div>
        </div>
        <span class="badge done" style="background:#FEE2E2;color:#DC2626;">-${c.soni} ${l.dona}</span>
      </div>
      <div class="time-text" style="margin-top:6px;">📅 ${formatDate(c.vaqt)}</div>
      ${c.izoh ? `<div style="font-size:12px;color:var(--ink-soft);margin-top:4px;">📝 ${esc(c.izoh)}</div>` : ''}
      ${isAdminChiqim && c.jamiSumma ? `<div style="margin-top:6px; font-weight:700; color:#7C3AED; background:#F3E8FF; display:inline-block; padding:3px 10px; border-radius:100px; font-size:12px;">💵 $${(c.narxBirlik||0).toLocaleString()}/dona &middot; Jami: $${(c.jamiSumma||0).toLocaleString()}</div>` : ''}
      
      ${isOmborchi ? `
      <div style="display:flex; gap:8px; margin-top:10px; border-top:1px dashed var(--line); padding-top:8px; justify-content:flex-end;">
        <button class="edit-btn" onclick="openEditChiqimModal(${originalIdx})">✏️ Tahrirlash</button>
        <button class="danger-btn" onclick="deleteChiqim(${originalIdx})">🗑️ O'chirish</button>
      </div>` : ''}
    </div>`;
  }).join('');

  return `
  ${renderBackButton()}
  <h2 class="section-title">🚚 ${l.chiqimTarixi}</h2>

  <!-- SANA FILTRI -->
  <div class="card" style="margin-bottom:14px;">
    <div style="display:flex; gap:10px; flex-wrap:wrap;">
      <div style="flex:1; min-width:130px;">
        <label class="field-label">${l.sanaDan}</label>
        <input type="date" value="${state.chiqimFrom || ''}" onchange="state.chiqimFrom=this.value;render();">
      </div>
      <div style="flex:1; min-width:130px;">
        <label class="field-label">${l.sanaGacha}</label>
        <input type="date" value="${state.chiqimTo || ''}" onchange="state.chiqimTo=this.value;render();">
      </div>

function updateYangiBuyurtmaJami() {
  const s = parseFloat(document.getElementById('fSoni').value) || 0;
  const n = parseFloat(document.getElementById('fNarx').value) || 0;
  const jamiEl = document.getElementById('fJamiSumma');
  if (jamiEl) jamiEl.textContent = `Jami summa: $${(s * n).toLocaleString()}`;
}

function toggleCustomModelInput(selectId, wrapId) {
  const sel = document.getElementById(selectId);
  const wrap = document.getElementById(wrapId);
  if (!sel || !wrap) return;
  wrap.style.display = sel.value === '__custom__' ? 'block' : 'none';
}

function editModelName(oldName) {
  const newName = prompt(`"${oldName}" fasonining yangi nomini kiriting:`, oldName);
  if (newName === null) return;
  const trimmed = newName.trim();
  if (!trimmed) { alert('Nom bo\'sh bo\'lishi mumkin emas'); return; }
  if (trimmed !== oldName && MODELS.includes(trimmed)) { alert('Bu nomdagi fason allaqachon mavjud'); return; }

  const idx = MODELS.indexOf(oldName);
  if (idx === -1) return;
  MODELS[idx] = trimmed;

  if (MODEL_START_STAGE[oldName]) {
    MODEL_START_STAGE[trimmed] = MODEL_START_STAGE[oldName];
    delete MODEL_START_STAGE[oldName];
  }

  alert('Diqqat: bu — faqat ro\'yxatdagi nomni o\'zgartiradi. Bu fasonda avval yaratilgan mavjud buyurtmalarning nomi o\'zgarmaydi.');
  saveFasonlar();
  render();
}

function deleteModelName(name) {
  if (!confirm(`"${name}" fasoni ro'yxatdan butunlay o'chirilsinmi? (Bu fasonda avval yaratilgan buyurtmalarga ta'sir qilmaydi, faqat endi yangi buyurtma yaratishda bu nom ro'yxatda chiqmay qoladi.)`)) return;

  MODELS = MODELS.filter(m => m !== name);
  delete MODEL_START_STAGE[name];
  saveFasonlar();
  render();
}

async function submitNewOrder() {
  const k = document.getElementById('fKonver').value;
  let m = document.getElementById('fModel').value;
  if (m === '__custom__') {
    m = (document.getElementById('fModelCustom').value || '').trim();
    if (!m) { alert('Yangi fason nomini kiriting'); return; }
    const startStage = document.getElementById('fModelCustomStart') ? document.getElementById('fModelCustomStart').value : 'zborka';
    if (!MODELS.includes(m)) {
      MODELS.push(m);
      MODEL_START_STAGE[m] = startStage;
      saveFasonlar();
    }
  }
  const s = parseInt(document.getElementById('fSoni').value);
  const n = parseFloat(document.getElementById('fNarx').value) || 0;
  const rang = document.getElementById('fRang') ? document.getElementById('fRang').value : '';
  const btn = document.getElementById('btnSaqlashYangi');
  if (btn) { btn.disabled = true; btn.textContent = '...'; }
  const ok = await createOrder(k, m, s, n, rang);
  if (btn) { btn.disabled = false; btn.textContent = L().saqlash; }
  if (ok) { switchTab('buyurtmalar'); }
}

function renderBuyurtmalar() {
  const l = L();
  if (state.orders.length === 0) return `${renderBackButton()}<div class="empty">📋 ${l.hechNarsaYoq}</div>`;
  
  const isAdmin = state.user.bolim === 'admin';

  const fromDate = state.buyurtmaFrom ? new Date(state.buyurtmaFrom + 'T00:00:00') : null;
  const toDate = state.buyurtmaTo ? new Date(state.buyurtmaTo + 'T23:59:59') : null;

  const filteredOrders = state.orders.filter(o => {
    const d = new Date(o.sana);
    if (fromDate && d < fromDate) return false;
    if (toDate && d > toDate) return false;
    return true;
  });

  // Saralash: 'sana' (standart — eng yangisi tepada) yoki 'konver' (konver raqami tartibida)
  const sortByKonver = state.buyurtmaSort === 'konver';
  const sortedOrders = sortByKonver
    ? filteredOrders.slice().sort((a, b) => a.id.localeCompare(b.id, undefined, { numeric: true, sensitivity: 'base' }))

  const dateFilterHtml = isAdmin ? `
  <div class="card" style="margin-bottom:14px;">
    <button class="secondary" style="width:100%; margin-bottom:10px;" onclick="state.buyurtmaSort = state.buyurtmaSort === 'konver' ? 'sana' : 'konver'; render();">
      ${sortByKonver ? '🔢 Saralash: Konver raqami bo\'yicha ▲ (bosing — sana bo\'yicha)' : '📅 Saralash: Sana bo\'yicha ▼ (bosing — konver raqami bo\'yicha)'}
    </button>
    <div style="display:flex; gap:10px; flex-wrap:wrap; margin-top:4px;">
      <div style="flex:1; min-width:130px;">
        <label class="field-label">${l.sanaDan}</label>
        <input type="date" value="${state.buyurtmaFrom || ''}" onchange="state.buyurtmaFrom=this.value;render();">
      </div>
      <div style="flex:1; min-width:130px;">
        <label class="field-label">${l.sanaGacha}</label>
        <input type="date" value="${state.buyurtmaTo || ''}" onchange="state.buyurtmaTo=this.value;render();">
      </div>
    </div>
    ${(state.buyurtmaFrom || state.buyurtmaTo) ? `<button class="secondary" style="width:100%; margin-top:8px;" onclick="state.buyurtmaFrom='';state.buyurtmaTo='';render();">✕ Sana filtrini tozalash</button>` : ''}
  </div>` : '';

  return `
  ${renderBackButton()}
  <h2 class="section-title">📝 ${l.buyurtmalar} ${isAdmin ? `<span style="font-weight:400; font-size:13px; color:var(--muted);">(${filteredOrders.length}/${state.orders.length})</span>` : ''}</h2>
  ${dateFilterHtml}
  ${filteredOrders.length === 0 ? `<div class="empty">📋 ${l.hechNarsaYoq}</div>` : ''}
  ${sortedOrders.map(o => {
    // MUHIM: bu yerda faqat HALI DAVOM ETAYOTGAN (holat 'tugadi' bo'lmagan)
    // bo'laklar ko'rsatiladi. 'tugadi' deb belgilangan yozuvlar — allaqachon
    // keyingi bosqichga o'tib bo'lgan, faqat tarix uchun saqlanadigan eski
    // yozuvlar; ularni ham shu ro'yxatga qo'shsak, xuddi o'sha dona hali ham
    // avvalgi bo'limda "qolib ketgandek" noto'g'ri ko'rinar edi.
    const stages = o.partiyalar
      .filter(p => p.holat !== 'tugadi' || p.bosqich === 'ombor')
      .map(p => `${getStageLabel(p.bosqich)} (${p.soni}${p.rang ? ' - ' + p.rang : ''})`).join(', ') || 'Tayyor';
    return `
    <div class="card">
      <div class="ticket" style="cursor:pointer" onclick="state.historyFor=null;state.historyModal='${o.id}';render();">
        <div class="stub">${esc(o.id)}</div>
        <div class="body">
          <div class="row-between">
            <div class="model">🪑 ${esc(o.model)} &middot; ${o.jamiSoni} ${l.dona}</div>
            ${o.holat === 'tayyor' ? `<span class="badge done">${l.holatTayyor}</span>` : `<span class="badge progress">${l.holatJarayonda}</span>`}
          </div>
          <div class="time-text" style="margin-top:4px;"><b>${l.buyurtmaVaqti}:</b> ${formatDate(o.sana)}</div>
          <div class="meta" style="margin-top:4px;">${stages}</div>
          ${isAdmin && o.narxBirlik ? `<div style="margin-top:6px; font-weight:700; color:#7C3AED; background:#F3E8FF; display:inline-block; padding:3px 10px; border-radius:100px; font-size:12px;">💵 $${o.narxBirlik}/dona &middot; Jami: $${(o.narxBirlik * o.jamiSoni).toLocaleString()}</div>` : ''}
        </div>
      </div>
      ${isAdmin ? `
      <div style="display:flex; gap:8px; margin-top:12px; border-top:1px dashed var(--line); padding-top:10px; justify-content:flex-end;">

function renderStatistika() {
  const l = L();
  const isAdmin = state.user.bolim === 'admin';
  const isOmbor = state.user.bolim === 'ombor';
  const targetDept = isAdmin ? state.selectedDeptFilter : state.user.bolim;
  
  let totalDoneSum = 0;
  let totalInProcessSum = 0;
  const perModelDone = {};
  const konverRows = [];

  const fromDate = state.statFrom ? new Date(state.statFrom + 'T00:00:00') : null;
  const toDate = state.statTo ? new Date(state.statTo + 'T23:59:59') : null;

  state.orders.concat(state.archive || []).forEach(o => {
    o.partiyalar.forEach(p => {
      const pBolim = p.bosqich;
      const isMatchDept = (pBolim === targetDept);

      if (isMatchDept) {
        if (p.tugashVaqti) {
          const tDate = new Date(p.tugashVaqti);
          if (fromDate && tDate < fromDate) return;
          if (toDate && tDate > toDate) return;
        }

        if (p.holat === 'tugadi') {
          totalDoneSum += p.soni;
          perModelDone[o.model] = (perModelDone[o.model] || 0) + p.soni;

          konverRows.push({
            konver: o.id, model: o.model, soni: p.soni,
            boshlangan: p.qabulVaqti, tugatilgan: p.tugashVaqti, holat: 'tugadi', rang: p.rang || null
          });
        } else {
          totalInProcessSum += p.soni;
          konverRows.push({
            konver: o.id, model: o.model, soni: p.soni,
            boshlangan: p.qabulVaqti, tugatilgan: null, holat: p.holat, rang: p.rang || null
          });
        }
      }
    });
  });

  konverRows.sort((a, b) => a.konver.localeCompare(b.konver, undefined, { numeric: true, sensitivity: 'base' }));

  const doneRows = Object.keys(perModelDone).map(m =>
    `<div class="list-row"><span><b>${m}</b></span><span class="mono"><b>${perModelDone[m]}</b> ${l.dona}</span></div>`
  ).join('') || `<div class="empty">${l.hechNarsaYoq}</div>`;

  const konverTableRows = konverRows.map(k => `
    <tr>
      <td><b>${esc(k.konver)}</b><br><span style="color:var(--ink-soft);font-size:11px;">${esc(k.model)}</span></td>
      <td><b>${k.soni}</b> ${l.dona}</td>
      <td>${k.rang ? colorBadge(k.rang) : '<span style="color:var(--ink-soft);font-size:11px;">—</span>'}</td>
      <td>${badge(k.holat)}</td>
      <td>${formatTimeOnly(k.tugatilgan || k.boshlangan)}</td>
    </tr>
  `).join('');

  const konverTableHtml = konverRows.length > 0 ? `
    <div style="max-height: ${isAdmin ? 340 : 250}px; overflow-y: auto;">
      <table class="clean-table">
        <thead>
          <tr>
            <th>Konver</th><th>Soni</th><th>Rang</th><th>Holati</th><th>Vaqt</th>
          </tr>
        </thead>
        <tbody>${konverTableRows}</tbody>
      </table>
    </div>
  ` : `<div class="empty">${l.hechNarsaYoq}</div>`;

  let omborRealCount = 0;
  Object.keys(state.ombor.zaxira).forEach(k => {
    const item = state.ombor.zaxira[k];
    const count = typeof item === 'object' ? item.soni : (parseInt(item) || 0);
    omborRealCount += count;
  });

  let jamiChiqimSoni = 0;
  if (state.ombor.chiqimlar && Array.isArray(state.ombor.chiqimlar)) {
    jamiChiqimSoni = state.ombor.chiqimlar.reduce((acc, item) => acc + (parseInt(item.soni) || 0), 0);
  }

  const deptTitle = getStageLabel(targetDept);

  // Bo'limlar (boshqaruvchidan boshqa hamma) uchun avvalgi, odatlangan ko'rinish o'zgarishsiz qoladi.
  // Yangi ko'rinish (pastda) faqat boshqaruvchiga. Raqamlar ikkalasida ham yuqoridagi bitta hisobdan olinadi.
  if (!isAdmin) {
    return `
    ${renderBackButton()}
    
    <button class="excel-btn" onclick="exportToExcel()">
      📥 Hisobotni Excelda yuklash (.xlsx)
    </button>

    <h2 class="section-title">📊 ${l.statistika} - ${deptTitle}</h2>
    
    ${isAdmin ? `
    <label class="field-label">Bo'limni tanlang:</label>
    <select onchange="state.selectedDeptFilter=this.value;render();" style="margin-bottom:12px;">
      ${STAGE_SEQ.map(s => `<option value="${s}" ${state.selectedDeptFilter===s?'selected':''}>${getStageLabel(s)}</option>`).join('')}
    </select>
    ` : ''}

    <div class="filter-box">
      <div>
        <label class="field-label">${l.sanaDan}</label>
        <input type="date" value="${state.statFrom}" onchange="setStatFrom(this.value);">
      </div>
      <div>
        <label class="field-label">${l.sanaGacha}</label>
        <input type="date" value="${state.statTo}" onchange="setStatTo(this.value);">
      </div>
    </div>

    <h2 class="section-title collapsible-header ${state.showFasonStat ? 'open' : ''}" onclick="state.showFasonStat=!state.showFasonStat;render();">
      <span>${l.fasonBoyicha} (Bajarilgan)</span>
      <span class="arrow">▼</span>
    </h2>
    ${state.showFasonStat ? `<div class="card scrollable-card">${doneRows}</div>` : ''}

    <h2 class="section-title collapsible-header ${state.showKonverStat ? 'open' : ''}" onclick="state.showKonverStat=!state.showKonverStat;render();">
      <span>📋 ${l.konverReport}</span>
      <span class="arrow">▼</span>
    </h2>
    ${state.showKonverStat ? `<div class="card" style="padding:12px;">${konverTableHtml}</div>` : ''}
    
    <div class="total-summary">
      <span class="label">Jami tugallangan:</span>
      <span class="number">${totalDoneSum} ${l.dona}</span>

function renderVaqtHisoboti() {
  const l = L();
  const fasonVaqtlari = {};

  state.orders.concat(state.archive || []).forEach(o => {
    let firstStart = null;
    let lastEnd = null;

    o.partiyalar.forEach(p => {
      if (p.qabulVaqti && (!firstStart || new Date(p.qabulVaqti) < new Date(firstStart))) {
        firstStart = p.qabulVaqti;
      }
      if (p.tugashVaqti && (!lastEnd || new Date(p.tugashVaqti) > new Date(lastEnd))) {
        lastEnd = p.tugashVaqti;
      }
    });

    if (firstStart && lastEnd) {
      const minutes = calcDurationMinutes(firstStart, lastEnd);
      if (!fasonVaqtlari[o.model]) fasonVaqtlari[o.model] = [];
      fasonVaqtlari[o.model].push(minutes);
    }
  });

  const rows = MODELS.map(m => {
    const list = fasonVaqtlari[m] || [];
    if (list.length === 0) return `<div class="list-row"><span><b>${m}</b></span><span class="mono" style="color:var(--ink-soft);">- minut</span></div>`;
    const avg = list.reduce((a,b)=>a+b,0) / list.length;
    return `<div class="list-row"><span><b>${m}</b> (${list.length} ta konver)</span><span class="mono"><b>${Math.round(avg)}</b> minut</span></div>`;
  }).join('');

  return `
  ${renderBackButton()}
  <h2 class="section-title">⏱️ ${l.vaqtHisoboti}</h2>
  <p style="font-size:12px;color:var(--ink-soft);margin-bottom:12px;">Har bir fason uchun boshidan omborga tayyor bo'lib o'tguncha ketgan o'rtacha minut:</p>
  <div class="card scrollable-card">${rows}</div>
  `;
}

function render() {
  const el = document.getElementById('app');
  if (!state.loaded) { el.innerHTML = `<div class="empty">Yuklanmoqda...</div>`; return; }
  if (!state.user) { el.className = 'lgapp'; el.innerHTML = renderLogin(); return; }   // kirish oynasida yuqori panel yo'q
  if (ARCHIVE_TABS.includes(state.tab) && !state.archiveLoaded && !state.archiveLoading) ensureArchive();

  let content = '';
  if (state.user.bolim === 'admin') {
    if (state.tab === 'menu') content = renderAdminHome();
    else if (state.tab === 'yangi') content = renderYangiBuyurtma();
    else if (state.tab === 'fasonlar') content = renderFasonlar();
    else if (state.tab === 'arxiv') content = renderArxiv();
    else if (state.tab === 'buyurtmalar') content = renderBuyurtmalar();
    else if (state.tab === 'ombor_zaxira') content = renderOmborZaxira();
    else if (state.tab === 'statistika') content = renderStatHub();
    else if (state.tab === 'vaqt') content = renderVaqtHisoboti();
    else if (state.tab === 'chiqimlar') content = renderChiqimlar();
    else if (state.tab === 'oylik') content = renderOylik();
    else if (state.tab === 'onlayn') content = renderOnlayn();
    else content = renderDeptDashboard();
  } else if (state.user.bolim === 'ombor') {
    if (state.tab === 'ombor_menu') content = renderOmborMenu();
    else if (state.tab === 'ombor_qabul') content = renderOmborQabul();
    else if (state.tab === 'ombor_zaxira') content = renderOmborZaxira();
    else if (state.tab === 'chiqimlar') content = renderChiqimlar();
    else content = renderOmborMenu();
  } else {
    if (state.tab === 'statistika') content = renderStatistika();
    else content = renderDeptDashboard();
  }

  let nonAdminTabs = '';
  if (state.user.bolim !== 'admin' && state.user.bolim !== 'ombor') {
    const l = L();
    const tabs = [['ish', l.navbat], ['statistika', l.statistika]];

    nonAdminTabs = `
    <div style="display:flex;gap:8px;margin-bottom:16px;overflow-x:auto;">

      <span>⚠️ Oxirgi o'zgarish serverga YOZILMADI! Internetni tekshirib, "Yangilash" tugmasini bosing.</span>
      <button onclick="state.saveFailedBanner=false; syncFromSheets(true);" style="background:#fff; color:#DC2626; border:none; border-radius:6px; padding:6px 10px; font-weight:700; font-size:12px; cursor:pointer; white-space:nowrap;">🔄 Qayta urinish</button>
    </div>` : '';
  // Boshqaruvchi: yangi qobiq (bosh sahifa + pastki/yon menyu). Bo'limlar: avvalgi ko'rinish o'zgarishsiz.
  const adminShell = state.user.bolim === 'admin';
  el.className = adminShell ? 'adm' : '';
  el.innerHTML = `
    ${adminShell ? renderAdminShell(content, failBanner) : `
    ${renderTopbar()}
    ${renderUserbar()}
    ${failBanner}
    <main>
      ${nonAdminTabs}
      ${content}
    </main>`}
    ${renderDoneModal()}
    ${renderColorModal()}
    ${renderSplitModal()}
    ${renderFixModal()}
    ${renderArchivePreviewModal()}
    ${renderDispatchModal()}
    ${renderManualKirimModal()}
    ${renderEditStockModal()}
    ${renderEditChiqimModal()}
    ${renderHistoryModal()}
    ${renderEditModal()}
    ${(pendingPushes > 0 || state.manualSyncInProgress) ? `
    <div style="position:fixed; inset:0; background:rgba(15,23,42,0.35); display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:9999; gap:12px;">
      <div style="width:46px; height:46px; border:4px solid rgba(255,255,255,0.35); border-top-color:#fff; border-radius:50%; animation:saqlanmoqda-spin 0.8s linear infinite;"></div>
      <div style="color:#fff; font-weight:700; font-size:14px; background:rgba(0,0,0,0.25); padding:6px 14px; border-radius:100px;">${state.manualSyncInProgress && pendingPushes === 0 ? 'Yangilanmoqda...' : 'Saqlanmoqda...'}</div>
    </div>
    <style>@keyframes saqlanmoqda-spin { to { transform: rotate(360deg); } }</style>
    ` : ''}
  `;
}

function appHandleBack(){
  try{
    if(state.user){
      if(state.navSheet){
        state.navSheet = false;
        render();
        if(window.AppInventor) window.AppInventor.setWebViewString('HANDLED');
        return;
      }
      const def = state.user.bolim === 'admin' ? 'menu' : (state.user.bolim === 'ombor' ? 'ombor_menu' : 'ish');
      if(state.tab !== def){
        state.tab = def;
        render();
        if(window.AppInventor) window.AppInventor.setWebViewString('HANDLED');
        return;
      }
    }
    if(window.AppInventor) window.AppInventor.setWebViewString('EXIT');
  }catch(e){
    if(window.AppInventor) window.AppInventor.setWebViewString('EXIT');
  }
}
window.appHandleBack = appHandleBack;
